<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>残骸样板 3D 检查</title>
<style>
  html,body{margin:0;height:100%;background:#1c1e26;font-family:Consolas,monospace}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:10px;top:8px;color:#cfd6e4;font-size:12px;line-height:1.6;
       background:rgba(0,0,0,.5);padding:9px 11px;border-radius:4px;z-index:9}
  #hud b{color:#7fd1ff}
  #items,#views{position:fixed;right:10px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;
       justify-content:flex-end;max-width:64vw}
  #items{top:44px} #views{top:8px}
  button{background:#2e3446;color:#cfd6e4;border:1px solid #4a5568;border-radius:3px;
         padding:5px 9px;font-size:12px;cursor:pointer}
  button:hover{background:#3d465c}
  button.on{background:#2f6f4f;border-color:#57b487;color:#eafff4}
</style>
</head>
<body>
<div id="app"></div><div id="hud"></div><div id="views"></div><div id="items"></div>
<script>
// 模块内异常写进 HUD —— 截图即可看到报错，无需另开控制台。
addEventListener('error', function(e){
  document.getElementById('hud').textContent =
    'ERR ' + e.message + ' @' + String(e.filename||'').split('/').pop() + ':' + e.lineno;
});
</script>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.js';
// ===========================================================================
// 残骸样板 3D 检查页
//
// 几何与 Source/RimFirstPerson3D/WreckageSamples.cs 一一对应（同批基本体、
// 同坐标、同 yaw/pitch）。UV 从 wreck_uv.json 读 —— 由 scripts/wreck_viewer_json.py
// 从 WreckageSamples.cs + WreckageUVGen.cs 真源生成，无第二份口径。
//
// 本页按 ModelBuilder 的**实测语义**复刻网格与取样：
//   · 矩阵 = TRS(pos, qYaw*qPitch)（Unity Quaternion.Euler(pitch,yaw,0) => R=Ry*Rx）
//   · 侧面 SideQuads（本批 sideTileH/W=0 => 单段拉伸）取 uv.side
//   · 顶面 TopRectFor 把该面在**模型空间 XZ 包围盒**中的占比映射进 uv.top
//   · 顶点 UV 存 Unity 口径 (u,v)，推入几何时翻成 v'=1-v（配合 tex.flipY=false）
// 描边由运行时 ModelBuilder.EmitHull 生成，本页用 EdgesGeometry 看棱线。
// ===========================================================================
const VER = '1791581401';
const clamp01 = x => x<0?0:x>1?1:x;
const lerp = (a,b,t)=>a+(b-a)*t;

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, stencil:true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.setClearColor(0x1c1e26, 1);
app.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c1e26);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.02, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const d1 = new THREE.DirectionalLight(0xffffff, 0.72); d1.position.set(3,6,4); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.28); d2.position.set(-4,3,-3); scene.add(d2);

const uvJson = await (await fetch('./wreck_uv.json?'+VER)).json();
const tex = new THREE.TextureLoader().load('./wreck_atlas.png?'+VER);
tex.colorSpace = THREE.SRGBColorSpace;
tex.magFilter = tex.minFilter = THREE.NearestFilter;
tex.generateMipmaps = false;
tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
tex.flipY = false;              // 顶点 UV 用 v'=1-v 对齐 Unity 口径
const mat = new THREE.MeshLambertMaterial({
  map:tex, side:THREE.DoubleSide,
  stencilWrite:true, stencilRef:1,
  stencilFunc:THREE.AlwaysStencilFunc,
  stencilZPass:THREE.ReplaceStencilOp
});
const matHull = new THREE.MeshBasicMaterial({
  color:0x0a0910, side:THREE.BackSide,
  stencilWrite:true, stencilRef:1,
  stencilFunc:THREE.NotEqualStencilFunc
});

function createHull(geo, width = 0.012){
  const g = geo.clone();
  if(!g.attributes.normal) g.computeVertexNormals();
  const pos = g.attributes.position;
  const norm = g.attributes.normal;
  const groups = new Map();
  const keyOf = i => `${Math.round(pos.getX(i)*2048)},${Math.round(pos.getY(i)*2048)},${Math.round(pos.getZ(i)*2048)}`;
  for(let i=0; i<pos.count; i++){
    const k = keyOf(i);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  }
  const newX = new Float32Array(pos.count);
  const newY = new Float32Array(pos.count);
  const newZ = new Float32Array(pos.count);
  for(let i=0; i<pos.count; i++){
    const grp = groups.get(keyOf(i));
    let nx=0, ny=0, nz=0;
    for(const gi of grp){ nx += norm.getX(gi); ny += norm.getY(gi); nz += norm.getZ(gi); }
    const len = Math.hypot(nx, ny, nz) || 1;
    newX[i] = pos.getX(i) + (nx/len) * width;
    newY[i] = pos.getY(i) + (ny/len) * width;
    newZ[i] = pos.getZ(i) + (nz/len) * width;
  }
  for(let i=0; i<pos.count; i++) pos.setXYZ(i, newX[i], newY[i], newZ[i]);
  return new THREE.Mesh(g, matHull);
}

// ---------------------------------------------------------------- 网格拼装
function G(){ return {pos:[],uv:[],idx:[]}; }
function pushV(g,p,u,v){ g.pos.push(p.x,p.y,p.z); g.uv.push(u,1-v); return g.pos.length/3-1; }
function quad(g,m,a,b,c,d,ua,ub,uc,ud){
  const A=a.clone().applyMatrix4(m),B=b.clone().applyMatrix4(m),
        C=c.clone().applyMatrix4(m),D=d.clone().applyMatrix4(m);
  const i0=pushV(g,A,ua[0],ua[1]),i1=pushV(g,B,ub[0],ub[1]),
        i2=pushV(g,C,uc[0],uc[1]),i3=pushV(g,D,ud[0],ud[1]);
  g.idx.push(i0,i1,i2,i0,i2,i3);
}
function tri(g,m,a,b,c,ua,ub,uc){
  const A=a.clone().applyMatrix4(m),B=b.clone().applyMatrix4(m),C=c.clone().applyMatrix4(m);
  const i0=pushV(g,A,ua[0],ua[1]),i1=pushV(g,B,ub[0],ub[1]),i2=pushV(g,C,uc[0],uc[1]);
  g.idx.push(i0,i1,i2);
}
function sideQuad(g,m,bl,br,tr,tl,r){
  quad(g,m,bl,br,tr,tl,[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]);
}
function topRect(m,a,b,c,d,uv){
  const r=uv.top, mx=Math.max(0.0001,uv.modelXZ[0]), mz=Math.max(0.0001,uv.modelXZ[1]);
  const A=a.clone().applyMatrix4(m),B=b.clone().applyMatrix4(m),
        C=c.clone().applyMatrix4(m),D=d.clone().applyMatrix4(m);
  const minX=Math.min(A.x,B.x,C.x,D.x),maxX=Math.max(A.x,B.x,C.x,D.x);
  const minZ=Math.min(A.z,B.z,C.z,D.z),maxZ=Math.max(A.z,B.z,C.z,D.z);
  const s0=clamp01((minX+mx*0.5)/mx), s1=clamp01((maxX+mx*0.5)/mx);
  const t0=clamp01((minZ+mz*0.5)/mz), t1=clamp01((maxZ+mz*0.5)/mz);
  return [lerp(r[0],r[2],s0), lerp(r[1],r[3],t0), lerp(r[0],r[2],s1), lerp(r[1],r[3],t1)];
}
function mkMat(px,py,pz,yaw=0,pitch=0,roll=0){
  const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw*Math.PI/180);
  const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch*Math.PI/180);
  const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), roll*Math.PI/180);
  const q = qY.multiply(qX).multiply(qZ);
  return new THREE.Matrix4().compose(new THREE.Vector3(px,py,pz), q, new THREE.Vector3(1,1,1));
}

function addBox(g,uv,m,s){
  const hw=s[0]/2,hd=s[2]/2,h=s[1];
  const ta=new THREE.Vector3(-hw,h,hd),tb=new THREE.Vector3(hw,h,hd),
        tc=new THREE.Vector3(hw,h,-hd),td=new THREE.Vector3(-hw,h,-hd);
  const r=topRect(m,ta,tb,tc,td,uv);
  quad(g,m,ta,tb,tc,td,[r[0],r[3]],[r[2],r[3]],[r[2],r[1]],[r[0],r[1]]);
  sideQuad(g,m,new THREE.Vector3(hw,0,-hd),new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(-hw,h,-hd),new THREE.Vector3(hw,h,-hd),uv.side);
  sideQuad(g,m,new THREE.Vector3(-hw,0,hd),new THREE.Vector3(hw,0,hd),new THREE.Vector3(hw,h,hd),new THREE.Vector3(-hw,h,hd),uv.side);
  sideQuad(g,m,new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(-hw,0,hd),new THREE.Vector3(-hw,h,hd),new THREE.Vector3(-hw,h,-hd),uv.side);
  sideQuad(g,m,new THREE.Vector3(hw,0,hd),new THREE.Vector3(hw,0,-hd),new THREE.Vector3(hw,h,-hd),new THREE.Vector3(hw,h,hd),uv.side);
}
function addCyl(g,uv,m,s,cone){
  const seg=12, r=s[0]/2, h=s[1], rz=s[2]/2, topR=cone?0.02*r:r, rs=uv.side;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2, u0=i/seg, u1=(i+1)/seg;
    const b0=new THREE.Vector3(Math.cos(a0)*r,0,Math.sin(a0)*rz);
    const b1=new THREE.Vector3(Math.cos(a1)*r,0,Math.sin(a1)*rz);
    const t1=new THREE.Vector3(Math.cos(a1)*topR,h,Math.sin(a1)*rz*topR/r);
    const t0=new THREE.Vector3(Math.cos(a0)*topR,h,Math.sin(a0)*rz*topR/r);
    quad(g,m,b1,b0,t0,t1,
      [lerp(rs[0],rs[2],u1),rs[1]],[lerp(rs[0],rs[2],u0),rs[1]],
      [lerp(rs[0],rs[2],u0),rs[3]],[lerp(rs[0],rs[2],u1),rs[3]]);
  }
  if(!cone){
    const tr=topRect(m,new THREE.Vector3(-r,h,rz),new THREE.Vector3(r,h,rz),
                       new THREE.Vector3(r,h,-rz),new THREE.Vector3(-r,h,-rz),uv);
    const cIdx=pushV(g,new THREE.Vector3(0,h,0).applyMatrix4(m),(tr[0]+tr[2])*0.5,(tr[1]+tr[3])*0.5);
    for(let i=0;i<seg;i++){
      const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
      const P0=new THREE.Vector3(Math.cos(a0)*r,h,Math.sin(a0)*rz).applyMatrix4(m);
      const P1=new THREE.Vector3(Math.cos(a1)*r,h,Math.sin(a1)*rz).applyMatrix4(m);
      const v0=pushV(g,P0,lerp(tr[0],tr[2],i/seg),lerp(tr[1],tr[3],i/seg));
      const v1=pushV(g,P1,lerp(tr[0],tr[2],(i+1)/seg),lerp(tr[1],tr[3],(i+1)/seg));
      g.idx.push(cIdx,v1,v0);
    }
  }
  const br=topRect(m,new THREE.Vector3(-r,0,rz),new THREE.Vector3(r,0,rz),
                     new THREE.Vector3(r,0,-rz),new THREE.Vector3(-r,0,-rz),uv);
  const bIdx=pushV(g,new THREE.Vector3(0,0,0).applyMatrix4(m),(br[0]+br[2])*0.5,(br[1]+br[3])*0.5);
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    const P0=new THREE.Vector3(Math.cos(a0)*r,0,Math.sin(a0)*rz).applyMatrix4(m);
    const P1=new THREE.Vector3(Math.cos(a1)*r,0,Math.sin(a1)*rz).applyMatrix4(m);
    const v0=pushV(g,P0,lerp(br[0],br[2],i/seg),lerp(br[1],br[3],i/seg));
    const v1=pushV(g,P1,lerp(br[0],br[2],(i+1)/seg),lerp(br[1],br[3],(i+1)/seg));
    g.idx.push(bIdx,v0,v1);
  }
}
function addWedge(g,uv,m,s){
  const hw=s[0]/2,hd=s[2]/2,h=s[1], rs=uv.side;
  const tr=topRect(m,new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(-hw,h,hd),new THREE.Vector3(hw,h,hd),new THREE.Vector3(hw,0,-hd),uv);
  sideQuad(g,m,new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(-hw,h,hd),new THREE.Vector3(hw,h,hd),new THREE.Vector3(hw,0,-hd),tr);
  sideQuad(g,m,new THREE.Vector3(-hw,0,hd),new THREE.Vector3(hw,0,hd),new THREE.Vector3(hw,h,hd),new THREE.Vector3(-hw,h,hd),rs);
  tri(g,m,new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(-hw,0,hd),new THREE.Vector3(-hw,h,hd),[rs[0],rs[1]],[rs[2],rs[1]],[(rs[0]+rs[2])*0.5,rs[3]]);
  tri(g,m,new THREE.Vector3(hw,0,hd),new THREE.Vector3(hw,0,-hd),new THREE.Vector3(hw,h,hd),[rs[0],rs[1]],[rs[2],rs[1]],[(rs[0]+rs[2])*0.5,rs[3]]);
  sideQuad(g,m,new THREE.Vector3(-hw,0,-hd),new THREE.Vector3(hw,0,-hd),new THREE.Vector3(hw,0,hd),new THREE.Vector3(-hw,0,hd),rs);
}
function build(name){
  const S=uvJson.samples[name], g=G();
  const uv={top:S.top, side:S.side, modelXZ:S.modelXZ};
  for(const p of S.parts){
    const m=mkMat(p.pos[0],p.pos[1],p.pos[2],p.yaw,p.pitch,p.roll||0);
    if(p.kind==='Box') addBox(g,uv,m,p.size);
    else if(p.kind==='Cylinder') addCyl(g,uv,m,p.size,false);
    else if(p.kind==='Cone') addCyl(g,uv,m,p.size,true);
    else if(p.kind==='Wedge') addWedge(g,uv,m,p.size);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(g.pos,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(g.uv,2));
  geo.setIndex(g.idx); geo.computeVertexNormals();
  return geo;
}

// ---------------------------------------------------------------- 场景
let ITEM='ruinedtank', cur='45°';
const root = new THREE.Group(); scene.add(root);
const grid = new THREE.GridHelper(24,48,0x4a5568,0x2e3446); grid.position.y=-0.004; scene.add(grid);

const VIEWS = {   // d=方向, k=距离系数(乘以模型半径)
  '45°':     {d:[1,0.85,-1],  k:1.95},
  '俯视':    {d:[0.02,1,0.02],k:2.30},
  '主视·南': {d:[0,0.30,-1],  k:2.20},
  '侧视·东': {d:[1,0.30,0],   k:2.20},
  '低角度':  {d:[1,0.16,-1],  k:1.95},
  '贴脸':    {d:[0.15,0.28,-1],k:0.95},
};
function setView(k){
  cur=k; const S=uvJson.samples[ITEM], b=S.bounds;
  const R=Math.max(0.25, 0.5*Math.hypot(b[0],b[1],b[2]));
  const v=VIEWS[k], L=Math.hypot(v.d[0],v.d[1],v.d[2]), dist=v.k*R;
  camera.position.set(v.d[0]/L*dist, v.d[1]/L*dist, v.d[2]/L*dist);
  controls.target.set(0, b[1]*0.45, 0); controls.update();
  [...document.getElementById('views').children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));
}
function rebuild(){
  while(root.children.length) root.remove(root.children[0]);
  const geo=build(ITEM);
  const bodyMesh = new THREE.Mesh(geo, mat);
  const hullMesh = createHull(geo);
  bodyMesh.renderOrder = 1;
  hullMesh.renderOrder = 2;
  root.add(bodyMesh);
  root.add(hullMesh);
  hud(); setView(cur);
}
function hud(){
  const S=uvJson.samples[ITEM], b=S.bounds;
  const f=r=>'['+r.map(x=>x.toFixed(3)).join(',')+']';
  document.getElementById('hud').innerHTML =
    `<b>${ITEM}</b> · 视图 ${cur}<br>`+
    `parts ${S.parts.length} · bounds ${b[0].toFixed(2)}x${b[1].toFixed(2)}x${b[2].toFixed(2)} m<br>`+
    `区域键 <b>${S.regionKey}</b> (src ${S.srcSize[0]}x${S.srcSize[1]}px)<br>`+
    `top ${f(S.top)}<br>side ${f(S.side)}<br>`+
    `图集 ${uvJson.size[0]}x${uvJson.size[1]} · 描边=反绕壳(运行时)<br>`+
    `拖拽旋转 · 滚轮缩放 · ←→ 切视角`;
}

Object.keys(VIEWS).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.k=k;
  b.onclick=()=>setView(k); document.getElementById('views').appendChild(b);
});
const bar=document.getElementById('items');
Object.keys(uvJson.samples).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.i=k;
  b.onclick=()=>{ITEM=k; [...bar.children].forEach(x=>x.classList.toggle('on',x.dataset.i===k)); rebuild();};
  bar.appendChild(b);
});
addEventListener('keydown',e=>{
  const ks=Object.keys(VIEWS), i=ks.indexOf(cur);
  if(e.key==='ArrowRight') setView(ks[(i+1)%ks.length]);
  if(e.key==='ArrowLeft')  setView(ks[(i-1+ks.length)%ks.length]);
});

const q=new URLSearchParams(location.search);
const TRIPTYCH = q.get('triptych') === '1';
if (TRIPTYCH) {
  ['hud', 'items', 'views'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = 'none'; });
  grid.visible = false;
}
if(uvJson.samples[q.get('item')]) ITEM=q.get('item');
if(VIEWS[q.get('view')]) cur=q.get('view');
[...bar.children].forEach(x=>x.classList.toggle('on',x.dataset.i===ITEM));
rebuild();

function renderTriptych() {
  const shots = ['45°', '主视·南', '侧视·东', '俯视'];
  const W = innerWidth, H = innerHeight, cw = Math.floor(W / shots.length);
  renderer.setScissorTest(true);
  camera.aspect = cw / H;
  camera.updateProjectionMatrix();
  const S = uvJson.samples[ITEM], b = S.bounds;
  const R = Math.max(0.25, 0.5 * Math.hypot(b[0], b[1], b[2]));
  shots.forEach((vKey, i) => {
    const v = VIEWS[vKey], L = Math.hypot(v.d[0], v.d[1], v.d[2]), dist = v.k * R;
    camera.position.set(v.d[0] / L * dist, v.d[1] / L * dist, v.d[2] / L * dist);
    controls.target.set(0, b[1] * 0.45, 0);
    controls.update();
    camera.lookAt(0, b[1] * 0.45, 0);
    renderer.setViewport(i * cw, 0, cw, H);
    renderer.setScissor(i * cw, 0, cw, H);
    renderer.render(scene, camera);
  });
}

function loop(){
  requestAnimationFrame(loop);
  if (TRIPTYCH) { renderTriptych(); return; }
  controls.update(); renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.__set = (item,view)=>{ if(uvJson.samples[item])ITEM=item; rebuild(); if(VIEWS[view])setView(view); };
</script>
</body>
</html>
