<body>

<script>
// 任何模块内异常都写进 HUD，截图就能直接看到报错，不用另开控制台。
addEventListener('error', function(e){
  document.getElementById('hud').textContent =
    'ERR ' + e.message + ' @' + String(e.filename||'').split('/').pop() + ':' + e.lineno;

</script>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.js';
// ===========================================================================
// 家具三视图重构检查页
//
// 几何与 Source/RimFirstPerson3D/Furniture3D.cs 一一对应（同一批基本体、
// 同一批 Metrics3D 尺寸）。UV **只从 furn_uv.json 读**——那张表由
// scripts/furn_atlas.py 从取样 SPEC 生成，与运行时用的 FurnitureUVGen.cs
// 同源，所以这里不存在第二份取样口径。
//
// 顶面 <- 当前朝向那张图的俯视段；四个立面各取自己那张图的立面段。
// ===========================================================================
const VER = 'shape2';
const M = {   // Metrics3D 镜像（改这里必须同步改 Metrics3D.cs）
  bedFrame:0.40, mattress:0.15, headboard:1.05, footboard:0.55, headThk:0.08,
  seat:0.45, slab:0.05, leg:0.07, nightstand:0.55, baseboard:0.10, counter:0.95,
  armSeat:0.42, armBack:0.85, armArm:0.62, uph:0.16, cush:0.09, tableH:0.75,
  pillow:0.11, pillowD:0.34, roll:0.08, chairBack:0.90, chairBackT:0.06,
  pole:1.55, shade:0.26, shadeD:0.38, potH:0.40, potD:0.50, columnH:1.85,
  rod:1.42, cloth:0.06, drapeCloth:0.95,
};
const ITEMS = {
  bed:      {arch:'bed',   w:1, d:2},
  stool:    {arch:'stool', w:1, d:1},
  endtable: {arch:'endtable', w:1, d:1},
  dresser:  {arch:'dresser',  w:2, d:1},
  shelf:    {arch:'shelf',    w:2, d:1},
  armchair: {arch:'armchair', w:1, d:1},   // Core def 无 <size> -> 1x1（占格查 def，别从贴图宽度反推）
  table1x2: {arch:'table', item:'table1x2', w:1, d:2},
  table2x2: {arch:'table', item:'table2x2', w:2, d:2},
  table2x4: {arch:'table', item:'table2x4', w:2, d:4},
  table3x3: {arch:'table', item:'table3x3', w:3, d:3},
  bookcase: {arch:'dresser', item:'bookcase', w:2, d:1},
  bookcasesmall: {arch:'dresser', item:'bookcasesmall', w:1, d:1},
  shelfsmall: {arch:'shelf', item:'shelfsmall', w:1, d:1},
  // 占格一律抄 def 的 <size>（South 帧）；build() 里转东/西时换轴，与 C# OccupiedRect 同口径
  couch:    {arch:'armchair', item:'couch', w:2, d:1},
  diningchair: {arch:'chair', item:'diningchair', w:1, d:1},
  doublebed: {arch:'bed', item:'doublebed', w:2, d:2},
  royalbed:  {arch:'bed', item:'royalbed',  w:2, d:2},
  hospitalbed: {arch:'bed', item:'hospitalbed', w:1, d:2},
  bedroll:   {arch:'bedroll', w:1, d:2},
  bedrolldouble: {arch:'bedroll', item:'bedrolldouble', w:2, d:2},
  // 单图型（Graphic_Single）：arch 名与取样件名不同时必须写 item:，否则查不到区
  standinglamp: {arch:'lamp', item:'standinglamp', w:1, d:1},
  floodlight: {arch:'floodlight', w:1, d:1},
  column:   {arch:'column', w:1, d:1},
  plantpot: {arch:'pot', item:'plantpot', w:1, d:1},
  penmarker:{arch:'marker', item:'penmarker', w:1, d:1},
  throne: {arch:'throne', item:'throne', w:1, d:1, seatH:0.48, backH:1.35},
  grandthrone: {arch:'grandthrone', w:3, d:2},
  drape:   {arch:'drape', w:2, d:1},
  stelelarge: {arch:'stele', item:'stelelarge', w:2, d:2},
  stelegrand: {arch:'stele', item:'stelegrand', w:3, d:3},
};

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.setClearColor(0x1c1e26, 1);
app.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c1e26);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const d1 = new THREE.DirectionalLight(0xffffff, 0.72); d1.position.set(3,6,4); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.28); d2.position.set(-4,3,-3); scene.add(d2);

const uvJson = await (await fetch('./furn_uv.json?'+VER)).json();
const tex = new THREE.TextureLoader().load('./furn_atlas.png?'+VER);
tex.colorSpace = THREE.SRGBColorSpace;
tex.magFilter = tex.minFilter = THREE.NearestFilter;
tex.generateMipmaps = false;
tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
tex.flipY = false;      // v 按"从图像顶部算"，所以要把 JSON 的 Unity 口径翻回来
const mat = new THREE.MeshLambertMaterial({map:tex, side:THREE.FrontSide});
const matHull = new THREE.MeshBasicMaterial({color:0x0a0910, side:THREE.BackSide});

// JSON 里是 Unity 口径 [u0,v0,u1,v1]（v=1-y/H）；flipY=false 下页面要 v'=1-v
function R(key){
  const a = uvJson.uv[key];
  if(!a) return null;
  return [a[0], 1-a[3], a[2], 1-a[1]];     // -> [u0, v'top, u1, v'bottom] 归一化自洽即可
}
const MISSING = new Set();      // 缺哪块区就记下来，渲染不崩（洋红面 = 看得见的问题）
const FALLBACK = [0, 0, 0.008, 0.008];
function Region(arch, want, region){
  let r = R(`${arch}.${want}.${region}`);
  if(r) return r;
  for(const v of ['south','north','east']){
    if(v===want) continue;
    r = R(`${arch}.${v}.${region}`); if(r) return r;
  }
  MISSING.add(`${arch}.${want}.${region}`);
  return null;
}
const viewOf = r => r==='south'?'south': r==='north'?'north':'east';
const opp = v => v==='south'?'north': v==='north'?'south':'west';
function faceUv(arch, rot, xz){
  const v = viewOf(rot);
  const cross = (v==='east') ? 'south' : 'east';
  // 与 C# FaceUv 同口径：整件没有立面段时（diningchair 的腿带是纯线稿、几何也不用它）
  // 退到木面，而不是去查一个不存在的区 —— 查不到会污染"缺取样区"判据。
  const s4 = hasRegion(arch, 'front')
    ? [Region(arch, opp(v), 'front'), Region(arch, v, 'front'),
       Region(arch, cross, 'front'), Region(arch, cross, 'front')]
    : (function(){ const w = wood(arch, rot); return [w,w,w,w]; })();
  return { top: Region(arch, v, 'top'), s4, xz };
}
// 与 C# Furniture3D.WoodRegion/WoodUv/SlabUv 同口径：SPEC 里每件声明一处 wood（干净木面区），
// 三视图没画到的面 —— 圆柱侧壁与顶盖、薄板四周一圈立边 —— 只能取它。
const woodKey = (arch, rot) => {
  for(const v of [viewOf(rot), 'south', 'north', 'east'])
    if(R(`${arch}.${v}.wood`)) return `${arch}.${v}.wood`;
  return null;
};
const wood = (arch, rot) => R(woodKey(arch, rot));
function woodUv(arch, rot, xz){ const w = wood(arch, rot); return {top:w, s4:[w,w,w,w], xz}; }
function slabUv(arch, rot, xz){ const u = faceUv(arch, rot, xz), w = wood(arch, rot); u.s4 = [w, w, w, w]; return u; }
// 端板：大面用立面段，左右两条 8cm 窄边用木面（与 C# EndPanelUv 同口径）
function endPanelUv(arch, rot, xz, longZ){
  const u = faceUv(arch, rot, xz), w = wood(arch, rot);
  if(longZ){ u.s4[2] = w; u.s4[3] = w; } else { u.s4[0] = w; u.s4[1] = w; }
  return u;
}

// 线稿型软包件：顶面/立面各点一条白面带（与 C# UvNames/PanelUv/BackSign 同口径）
function uvNames(arch, rot, xz, tr, sr){
  const v = viewOf(rot), t = Region(arch, v, tr), s = Region(arch, v, sr);
  return {top:t, s4:[s,s,s,s], xz};
}
function panelUv(arch, rot, xz, face, longZ){
  const v = viewOf(rot), t = Region(arch, v, 'top'), s = Region(arch, v, face), w = wood(arch, rot);
  const s4 = [s, s, s, s];
  if(longZ){ s4[2] = w; s4[3] = w; } else { s4[0] = w; s4[1] = w; }
  return {top:t, s4, xz};
}
const backSign = r => (r==='south' ? 1 : r==='north' ? -1 : r==='east' ? -1 : 1);

// ---------------------------------------------------------------- 网格拼装
// dir: 0北(-Z) 1南(+Z) 2东(+X) 3西(-X)
function G(){ return {pos:[],uvs:[],idx:[]}; }
function quad(g,a,b,c,d,ua,ub,uc,ud){
  const P=g.pos,U=g.uvs,I=g.idx;
  const push=(p,uv)=>{P.push(p[0],p[1],p[2]);U.push(uv[0],uv[1]);return P.length/3-1;};
  const i0=push(a,ua),i1=push(b,ub),i2=push(c,uc),i3=push(d,ud);
  I.push(i0,i1,i2,i0,i2,i3);
}
function box(g, uv, cx,cy,cz, w,h,d, nt){
  const x0=cx-w/2,x1=cx+w/2, z0=cz-d/2,z1=cz+d/2, y0=cy,y1=cy+h;
  const mx=Math.max(0.001,uv.xz[0]), mz=Math.max(0.001,uv.xz[1]);
  const U=x=>tu[0]+(tu[2]-tu[0])*((x+mx/2)/mx);
  const V=z=>tu[1]+(tu[3]-tu[1])*((z+mz/2)/mz);
  const tu = uv.top||FALLBACK;
  if(uv.top && !nt) quad(g,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],   // nt = noTop：埋在别的部件下面
     [U(x0),V(z1)],[U(x1),V(z1)],[U(x1),V(z0)],[U(x0),V(z0)]);
  const s=i=>uv.s4[i]||uv.top||FALLBACK;
  let r=s(0); quad(g,[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]);
  r=s(1);      quad(g,[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]);
  r=s(3);      quad(g,[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]);
  r=s(2);      quad(g,[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]);
}
// 第 7 个参数 = **直径**，与 C# Part.size.x（Cylinder 用直径）同口径。
// 之前按半径用，凳面/腿/床柱在检查页里全比游戏内粗一倍。
function cyl(g, uv, cx,cz,y0,h,dia,seg=12){
  const r = dia/2;
  const s = uv.s4[1]||uv.top||FALLBACK;
  const cp = uv.top||FALLBACK;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
    const p=(a,y)=>[cx+Math.cos(a)*r, y, cz+Math.sin(a)*r];
    quad(g, p(a0,y0),p(a1,y0),p(a1,y0+h),p(a0,y0+h),
      [s[0]+(s[2]-s[0])*i/seg, s[1]], [s[0]+(s[2]-s[0])*(i+1)/seg, s[1]],
      [s[0]+(s[2]-s[0])*(i+1)/seg, s[3]], [s[0]+(s[2]-s[0])*i/seg, s[3]]);
  }
  if(uv.top){
    const mx=Math.max(0.001,uv.xz[0]), mz=Math.max(0.001,uv.xz[1]);
    for(let i=0;i<seg;i++){
      const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
      const P=(a)=>[cx+Math.cos(a)*r, y0+h, cz+Math.sin(a)*r];
      // 顶盖按 rim 点的 XZ 位置映射进取样区（与盒体顶面同口径），不是沿对角线铺
    const UV=(a)=>{const p=[cx+Math.cos(a)*r, cz+Math.sin(a)*r];
        const u=Math.min(1,Math.max(0,(p[0]+mx/2)/mx)), v=Math.min(1,Math.max(0,(p[1]+mz/2)/mz));
        return [cp[0]+(cp[2]-cp[0])*u, cp[1]+(cp[3]-cp[1])*v];};
      // 圆心那两点的 UV 必须是取样区的**中心**（与 C# Model3D 的 center 顶点同口径）。
      // 之前写成 UV(a0)：每个三角的圆心被钉在同一条 rim 上 -> 圆面被拉成 12 片扇形黑白相间。
      const UC=[(cp[0]+cp[2])/2,(cp[1]+cp[3])/2];
      quad(g, [cx,y0+h,cz],[cx,y0+h,cz],P(a1),P(a0), UC,UC,UV(a1),UV(a0));
    }
  }
}
function legs(g,uv,off,topY,r){
  for(const sx of [-1,1]) for(const sz of [-1,1]) cyl(g,uv,sx*off,sz*off,0,topY,r);
}
function endPanel(g,uv,longZ,thick,sign,len,y0,h){
  if(h<=0.01) return;
  const t=M.headThk;
  if(longZ) box(g,uv,0,y0,sign*(len/2-t/2), thick*0.96,h,t);
  else      box(g,uv,sign*(len/2-t/2),y0,0, t,h,thick*0.96);
}

const hasRegion = (key, name) => ['south','north','east'].some(v => R(`${key}.${v}.${name}`));

// 与 C# Furniture3D.AddPillows 同口径：pos.y 是底面，surfY = 床垫上表面
function pillows(g, uv, w, d, rot, surfY, depth, thick){
  const longZ = (rot==='north'||rot==='south'), bs = backSign(rot);
  const len = longZ?d:w, wid = longZ?w:d;
  const n = wid>=1.5?2:1, pw = wid*0.84/n;
  for(let i=0;i<n;i++){
    const off = (i-(n-1)*0.5)*pw*1.08, z = bs*(len/2-depth/2-0.07);
    if(longZ) box(g,uv,off,surfY,z, pw*0.94,thick,depth);
    else      box(g,uv,z,surfY,off, depth,thick,pw*0.94);
  }
}

function build(item, rot){
  const it = ITEMS[item], key = it.item || it.arch;   // 取样件名（一个配方可以服务多件）
  const uv0 = faceUv(key, rot, [it.w, it.d]);
  const g = G();
  let w = it.w, d = it.d;
  if(rot==='east'||rot==='west'){ const t=w; w=d; d=t; }
  const longZ = (rot==='north'||rot==='south');
  const len = longZ?d:w, thick = longZ?w:d;
  const headSign = backSign(rot);
  if(it.arch==='bed'){
    box(g,woodUv(key,rot,[w,d]),0,0,0, w-0.06,M.bedFrame,d-0.06, true);   // 床架侧板=木面，顶埋进床垫
    box(g,uv0,0,M.bedFrame,0, w-0.20,M.mattress,d-0.18);
    const uvb = endPanelUv(key, rot, [w,d], longZ);
    endPanel(g,uvb,longZ,thick,headSign,len,M.bedFrame,M.headboard-M.bedFrame);
    endPanel(g,uvb,longZ,thick,-headSign,len,M.bedFrame,M.footboard-M.bedFrame);
    if(hasRegion(key,'pillow'))
      pillows(g, uvNames(key,rot,[w,d],'pillow','pillow'), w, d, rot,
              M.bedFrame+M.mattress, M.pillowD, M.pillow);
    const uvq = woodUv(key, rot, [w,d]);
    const r = M.leg*1.1, bs2 = backSign(rot);
    for(const sa of [-1,1]){
      const h = sa*bs2 > 0 ? M.headboard : M.footboard;   // 床头端高柱、床尾端矮柱
      for(const sl of [-1,1]){
        if(longZ) cyl(g,uvq, sl*(w/2-r), sa*(d/2-r), 0, h, r*2);
        else      cyl(g,uvq, sa*(w/2-r), sl*(d/2-r), 0, h, r*2);
      }
    }
  } else if(it.arch==='stool'){
    const sw = Math.min(0.44, w*0.6);
    const seat = faceUv(key,rot,[sw,sw]);          // 顶盖 = 座面，侧壁（座沿一圈）= 木面
    seat.s4[1] = wood(key,rot);
    cyl(g, seat, 0,0, M.seat, M.cush, sw);
    legs(g, woodUv(key,rot,[w,d]), sw*0.34, M.seat, M.leg);
  } else if(it.arch==='bedroll'){
    box(g, faceUv(key,rot,[w,d]), 0,0,0, w-0.08,M.roll,d-0.08);
    if(hasRegion(key,'pillow'))
      pillows(g, uvNames(key,rot,[w,d],'pillow','pillow'), w, d, rot, M.roll, M.pillowD, M.pillow);
  } else if(it.arch==='chair'){
    const sh=M.seat, sw=Math.min(0.52, Math.min(w,d)*0.72), bs=backSign(rot), bt=M.chairBackT;
    const seat = faceUv(key,rot,[sw,sw]);
    seat.s4[1] = wood(key,rot);
    cyl(g, seat, 0,0, sh, M.cush, sw);
    const ub = panelUv(key,rot,[w,d],'back', longZ);
    if(longZ) box(g,ub,0,sh-0.04,bs*(sw/2-bt/2), sw*0.86,M.chairBack-sh+0.04,bt);
    else      box(g,ub,bs*(sw/2-bt/2),sh-0.04,0, bt,M.chairBack-sh+0.04,sw*0.86);
    legs(g, woodUv(key,rot,[w,d]), sw*0.33, sh, M.leg);
  } else if(it.arch==='lamp'){
    const poleTop = M.pole - M.shade;
    cyl(g, uvNames(key,rot,[w,d],'front','front'), 0,0, 0, 0.05, 0.36);
    cyl(g, uvNames(key,rot,[w,d],'wood','neck'), 0,0, 0.05, poleTop-0.05, 0.05);
    cyl(g, uvNames(key,rot,[w,d],'top','top'), 0,0, poleTop, M.shade, M.shadeD);
  } else if(it.arch==='column'){
    cyl(g, uvNames(key,rot,[w,d],'front','front'), 0,0, 0.14, M.columnH-0.30, 0.34);
    const uc = uvNames(key,rot,[w,d],'top','front');
    box(g, uc, 0,0,0, 0.56,0.14,0.56);
    box(g, uc, 0,M.columnH-0.16,0, 0.60,0.16,0.60);
  } else if(it.arch==='pot'){
    const up = faceUv(key,rot,[M.potD,M.potD]);
    cyl(g, up, 0,0, 0, M.potH, M.potD);
  } else if(it.arch==='marker'){
    box(g, uvNames(key,rot,[w,d],'front','front'), 0,0,0, 0.10,0.85,0.10);
    box(g, uvNames(key,rot,[w,d],'top','top'), 0,0.60,0, 0.62,0.20,0.08);
    box(g, uvNames(key,rot,[w,d],'tip','tip'), 0,0.80,0, 0.10,0.14,0.10);
  } else if(it.arch==='floodlight'){
    cyl(g, uvNames(key,rot,[w,d],'baser','basel'), 0,0, 0, 0.14, 0.62);   // 底座：顶面/侧壁各一条实心带
    cyl(g, uvNames(key,rot,[w,d],'pole','pole'), 0,0, 0.14, 0.62, 0.16);
    box(g, uvNames(key,rot,[w,d],'top','top'), 0,0.76,0, 0.90,0.24,0.30);
  } else if(it.arch==='grandthrone'){
    const ud = uvNames(key,rot,[w,d],'top','front'), bs=backSign(rot);
    box(g, ud, 0,0,0, w*0.96,0.16,d*0.94);
    box(g, ud, 0,0.16,-bs*d*0.22, w*0.78,0.14,d*0.50);
    const ug = uvNames(key,rot,[w,d],'gold','gold');
    box(g, ug, 0,0.30,0, 0.95,0.22,0.85);
    box(g, ug, 0,0.52,bs*0.36, 0.80,0.85,0.14);
    box(g, uvNames(key,rot,[w,d],'spire','spire'), 0,1.37,bs*0.30, 0.34,0.42,0.28);
    for(const sd of [-1,1]) box(g, ug, sd*0.62,0.52,-0.04, 0.22,0.34,0.70);
  } else if(it.arch==='drape'){
    const bs=backSign(rot), sv=viewOf(rot);
    const ut = uvNames(key,rot,[w,d],'tassel','tassel'), u2 = uvNames(key,rot,[w,d],'tassel2','tassel2'),
          u3 = uvNames(key,rot,[w,d],'tassel3','tassel3');
    box(g, ut, 0,M.rod,bs*0.02, w*0.86,0.09,0.09);
    box(g, ut, -w*0.36,0.34,bs*0.02, 0.09,0.13,0.09);
    box(g, u3, 0,0.34,bs*0.02, 0.09,0.13,0.09);
    box(g, u2, w*0.36,0.34,bs*0.02, 0.09,0.13,0.09);
    const F=Region(key,sv,'mid'), E=Region(key,sv,'front');   // 大面=布身中段；裙摆花边给薄边
    box(g, {top:Region(key,sv,'top'), s4:[F,F,E,E], xz:[w*0.82,M.cloth]}, 0,0.47,bs*0.02, w*0.82,M.drapeCloth,M.cloth);
  } else if(it.arch==='stele'){
    // 与 C# Arch.Stele 同口径：碑身三段叠块，每段的大面/薄边/顶面各取一条横带
    const h=0.55+0.50*Math.max(w,d), sv=viewOf(rot);
    const bd=(f,e,cap,xz)=>{const F=Region(key,sv,f), E=Region(key,sv,e);
      return {top:Region(key,sv,cap), s4:[F,F,E,E], xz};};
    const hLow=(h-0.18)*0.40, hMid=(h-0.18)*0.32;
    box(g, bd('face','mid','mid',[w*0.56,0.24]), 0,0.18,0, w*0.56,hLow,0.24);
    box(g, bd('mid','shoulder','mid',[w*0.48,0.22]), 0,0.18+hLow,0, w*0.48,hMid,0.22);
    box(g, bd('top','top','crest',[w*0.38,0.20]), 0,0.18+hLow+hMid,0, w*0.38,h-0.18-hLow-hMid,0.20);
    box(g, uvNames(key,rot,[w,d],'front','front'), 0,0,0, w*0.72,0.18,d*0.42);
  } else if(it.arch==='endtable'){
    const h = M.nightstand - M.slab;
    box(g, slabUv(key,rot,[w,d]), 0,h,0, w*0.92,M.slab,d*0.92);
    box(g, faceUv(key,rot,[w,d]), 0,M.baseboard,0, w*0.78,h-M.baseboard,d*0.72, true);
    legs(g, woodUv(key,rot,[w,d]), w*0.36, M.baseboard+0.02, M.leg);
  } else if(it.arch==='table'){
    const th=M.slab, h=M.tableH-th;
    box(g, uvNames(key,rot,[w,d],'top','edge'), 0,h,0, w-0.04,th,d-0.04);
    const ul = uvNames(key,rot,[w,d],'wood','front');   // 腿侧 = 画出来的腿条，圆盖 = 木面
    const off = Math.min(w,d)/2-0.14;
    for(const sx of [-1,1]) for(const sz of [-1,1]) cyl(g,ul,sx*off,sz*off,0,h,M.leg);
  } else if(it.arch==='armchair'||it.arch==='throne'){
    const sh=it.seatH||M.armSeat, bk=it.backH||M.armBack, t=M.uph, bs=backSign(rot);
    box(g, uvNames(key,rot,[w,d],'top','front'), 0,0,0, w*0.9,sh,d*0.86);
    const ub = panelUv(key,rot,[w,d],'back', longZ);
    if(longZ) box(g,ub,0,sh,bs*(d/2-t/2), w*0.98,bk-sh,t);
    else      box(g,ub,bs*(w/2-t/2),sh,0, t,bk-sh,d*0.98);
    for(let i=0;i<2;i++){
      const sgn = i? 1 : -1, ua = panelUv(key,rot,[w,d], i?'armr':'arml', longZ);
      if(longZ) box(g,ua,sgn*(w/2-t/2),0,0, t,M.armArm,d*0.88);
      else      box(g,ua,0,0,sgn*(d/2-t/2), w*0.88,M.armArm,t);
    }
  } else {
    const sh = it.arch==='shelf';
    const h = sh?0.85:M.counter;
    box(g, slabUv(key,rot,[w,d]), 0,h,0, w*0.96,M.slab,d*0.96);
    const u = sh ? slabUv(key,rot,[w,d]) : faceUv(key,rot,[w,d]);
    if(sh){
      for(let i=0;i<3;i++) box(g,u,0,h*(0.12+i*0.34),0, w*0.84,M.slab,d*0.78);
      // pos.y = 底面高度（与 C# Part 同口径），写 h*0.5 会让侧板悬在半空
      box(g,u,-w*0.45,0,0, M.slab,h,d*0.8);
      box(g,u, w*0.45,0,0, M.slab,h,d*0.8);
    } else box(g,u,0,0,0, w*0.9,h,d*0.8);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(g.uvs,2));
  geo.setIndex(g.idx); geo.computeVertexNormals();
  return geo;
}

let ITEM='bed', ROT='south';
const root = new THREE.Group(); scene.add(root);
const grid = new THREE.GridHelper(12,24,0x4a5568,0x2e3446); grid.position.y=-0.003; scene.add(grid);
const EMPTY = new URLSearchParams(location.search).get('empty') === '1';
const FLAT = new URLSearchParams(location.search).get('flat') === '1';
// still=1：审核出图用。按钮/朝向条是 DOM 叠层，与差分参考图必然不一致，
// 留在画面里就得靠"切掉顶部 205 行"遮丑 —— 正上方机位的模型顶部会被一起切掉，
// 于是好件被误判成剪影断裂。关掉叠层后差分只剩模型本体，不用切。
const STILL = new URLSearchParams(location.search).get('still') === '1';
// 关叠层必须在**按钮都建好之后**再关：朝向条 #rots 是 addRotBar() 动态造的，
// 在脚本开头那次循环里它还不存在，于是漏进每一格审核图，被差分抓成一个假"部件"。
function hideChrome(){
  if (!STILL) return;
  for (const id of ['views', 'items', 'rots', 'hud'])
    { const e = document.getElementById(id); if (e) e.style.display = 'none'; }
}   // 差分/着色探针用
// 出图模式下把"缺取样区"标成左下角一块纯洋红：审核台按像素判，比读文字可靠。
// 空场景参考图也必须走这里 —— 否则两边左下角不一样，差分会把哨兵本身抓成一个"部件"。
function sentinel(){
  if (!STILL) return;
  let b = document.getElementById('miss');
  if (!b) { b = document.createElement('div'); b.id = 'miss';
    b.style.cssText = 'position:fixed;left:0;bottom:0;width:24px;height:24px;z-index:20';
    document.body.appendChild(b); }
  b.style.background = MISSING.size ? 'rgb(255,0,255)' : 'rgb(28,30,38)';
}

function rebuild(){
  hideChrome();
  while(root.children.length) root.remove(root.children[0]);
  if(EMPTY){ hud(); sentinel(); return; }   // 差分回路用：只画场景不画模型（?empty=1）
  const geo = build(ITEM, ROT);
  root.add(new THREE.Mesh(geo, FLAT ? new THREE.MeshNormalMaterial() : mat));
  // 描边：运行时用**沿平均法线外扩的反绕壳**（ModelBuilder.ToHull）。
  // 这里不能用整组 scale —— 那会把细件（立柱）按离原点的距离整体撑歪。
  // 检查页只需要看棱线是否落在正确的面上，故用 EdgesGeometry。
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, 45),
    new THREE.LineBasicMaterial({color:0x0a0910}));
  root.add(edges);
  hud();
  sentinel();
}

const VIEWS = {
  '45°':     {p:[2.6,2.2,-2.6], t:[0,0.55,0]},
  '俯视':    {p:[0.02,6.0,0.02],t:[0,0,0]},
  '主视·南': {p:[0,0.9,-6.0],    t:[0,0.6,0]},
  '侧视·东': {p:[6.0,0.9,0],     t:[0,0.6,0]},
  '低角度':  {p:[2.2,0.45,-2.2], t:[0,0.5,0]},
  '贴脸':    {p:[0.2,0.75,-1.15],t:[0,0.5,0]},
};
let cur='45°';
function setView(k){
  cur=k; const v=VIEWS[k];
  // 机位按占格外推：贴脸机位离中心 1.15m，而 3x3 的桌半径 2.1m —— 相机埋在网格里面，
  // 画面只剩几条桌沿，剪影闸门会把这种取景误判成"断裂"。小件（半径<0.9）保持原机位。
  const it = ITEMS[ITEM], R = it ? 0.5*Math.hypot(it.w, it.d) : 0.707;
  const sc = Math.max(1, R/0.9);
  camera.position.set(v.p[0]*sc, v.p[1]*sc, v.p[2]*sc);
  controls.target.set(...v.t); controls.update();
  [...document.getElementById('views').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
Object.keys(VIEWS).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.k=k;
  b.onclick=()=>setView(k); document.getElementById('views').appendChild(b);
});
const bar=document.getElementById('items');
Object.keys(ITEMS).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.i=k;
  b.onclick=()=>{ITEM=k; [...bar.children].forEach(x=>x.classList.toggle('on',x.dataset.i===k)); rebuild();};
  bar.appendChild(b);
});
const rots=['south','north','east','west'];
function addRotBar(){
  const r=document.createElement('div'); r.id='rots'; r.style.cssText='position:fixed;right:10px;top:78px;z-index:9;display:flex;gap:6px';
  rots.forEach(k=>{
    const b=document.createElement('button'); b.textContent='朝向'+k; b.dataset.r=k;
    b.onclick=()=>{ROT=k; [...r.children].forEach(x=>x.classList.toggle('on',x.dataset.r===k)); rebuild();};
    r.appendChild(b);
  });
  document.body.appendChild(r);
  [...r.children][0].classList.add('on');
}
addRotBar();
function hud(){
  const ii=ITEMS[ITEM], kk=ii.item||ii.arch;
  const f=faceUv(kk, ROT, [ii.w, ii.d]);
  const fmt=r=>r?`[${r.map(x=>x.toFixed(3)).join(',')}]`:'null';
  document.getElementById('hud').innerHTML =
    `<b>${ITEM}</b> 朝向 <b>${ROT}</b> · 视图 ${cur}<br>`+
    `顶面 <- ${kk}.${viewOf(ROT)}.top<br>&nbsp;&nbsp;${fmt(f.top)}<br>`+
    `立面 北 <- ${opp(viewOf(ROT))}: ${fmt(f.s4[0])}<br>`+
    `立面 南 <- ${viewOf(ROT)}: ${fmt(f.s4[1])}<br>`+
    `立面 东/西 <- ${(viewOf(ROT)==='east'?'south':'east')}: ${fmt(f.s4[2])}<br>`+
    `木面 圆柱/薄边 <- ${kk}.${viewOf(ROT)}.wood: ${fmt(wood(kk,ROT))}<br>`+
    (MISSING.size? `<b style="color:#ff8f8f">缺取样区 ${[...MISSING].join(' ')}</b><br>`:'')+
    `图集 ${uvJson.size[0]}x${uvJson.size[1]} · 黑笔画已补绘，描边=反绕壳<br>`+
    `拖拽旋转 · 滚轮缩放 · ←→ 切视角`;
}
addEventListener('keydown',e=>{
  const ks=Object.keys(VIEWS), i=ks.indexOf(cur);
  if(e.key==='ArrowRight') setView(ks[(i+1)%ks.length]);
  if(e.key==='ArrowLeft')  setView(ks[(i-1+ks.length)%ks.length]);
});
const q=new URLSearchParams(location.search);
setView(VIEWS[q.get('view')] ? q.get('view') : '45°');
if(ITEMS[q.get('item')]){ ITEM=q.get('item'); [...bar.children].forEach(x=>x.classList.toggle('on',x.dataset.i===ITEM)); }
if(rots.includes(q.get('rot'))){ ROT=q.get('rot'); }
const PRETTY = q.get('pretty')==='1' || q.get('gallery')==='1';
// 出图模式：只改呈现，不动审核用的机位与判据。
if(PRETTY){
  ['hud','items','views','rots'].forEach(id=>{const e=document.getElementById(id); if(e) e.style.display='none';});
  grid.visible = false;
  // 出图模式关阴影：投到地面的影子也是"与空场景的差异"，会被剪影闸门当成一个部件
  renderer.shadowMap.enabled = !STILL; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
  scene.background = new THREE.Color(0x2b3242);
  scene.fog = new THREE.Fog(0x2b3242, 16, 44);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
                                new THREE.MeshLambertMaterial({color:0x555f70}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.003;
  ground.receiveShadow = true; scene.add(ground);
  scene.children.filter(o=>o.isDirectionalLight).forEach(l=>l.intensity*=0.3);
  scene.children.filter(o=>o.isAmbientLight).forEach(l=>l.intensity=0.3);
  const key = new THREE.DirectionalLight(0xfff1dd, 1.15);
  key.position.set(4.5,7.5,5.5); key.castShadow = !STILL;
  key.shadow.mapSize.set(2048,2048);
  const sc = key.shadow.camera; sc.left=-14; sc.right=14; sc.top=14; sc.bottom=-14; sc.far=42;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fc4ff, 0.5); rim.position.set(-5,3.5,-6); scene.add(rim);
}
if(q.get('gallery')==='1'){
  // 全量展厅：同类排一排，行内按各自包围盒推进，行间距取该行最"深"的那件。
  // 相机在 -Z 看向 +Z，x 小的落在画面右边 -> 数组顺序就是从右往左念。
  const EYE = 1.62;                       // Metrics3D.HumanEyeHeight：第一人称相机基准
  const only = q.get('row');
  const SETS = [
    ['bed','doublebed','royalbed','hospitalbed','bedroll','bedrolldouble'],
    ['armchair','couch','diningchair','throne','grandthrone','stool'],
    ['dresser','endtable','shelf','shelfsmall','bookcase','bookcasesmall'],
    ['table1x2','table2x2','table2x4','table3x3','column','plantpot'],
    ['standinglamp','floodlight','penmarker','drape','stelelarge','stelegrand'],
  ];
  const rows = only === null ? SETS : [SETS[+only] || SETS[0]];
  const gap = 0.8;
  let z = 0, widest = 0;
  for(const row of rows){
    let x = 0, deep = 0;
    for(const it of row){
      const geo = build(it,'south'); geo.computeBoundingBox();
      const w = geo.boundingBox.max.x - geo.boundingBox.min.x;
      const dp = geo.boundingBox.max.z - geo.boundingBox.min.z;
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x+w/2, 0, z); m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo,45),
                                       new THREE.LineBasicMaterial({color:0x14161c}));
      e.position.copy(m.position); scene.add(e);
      x += w + gap; deep = Math.max(deep, dp);
    }
    widest = Math.max(widest, x - gap);
    z += deep + gap * 2.2;
  }
  const total = widest, depth = z - gap * 2.2;
  if(only === null){
    controls.target.set(total/2, 0.5, depth/2);
    camera.position.set(total/2, Math.max(6, depth*0.75), depth/2 - Math.max(total, depth)*1.15);
    camera.lookAt(total/2, 0.5, depth/2);
  } else {
    // 人眼高度平视：站在这排家具前面 3.4m 看过去
    controls.target.set(total/2, 0.85, 0);
    camera.position.set(total/2, EYE, -3.4);
    camera.lookAt(total/2, 0.9, 0);
  }
} else {
  rebuild();
  if(PRETTY) root.traverse(o=>{ o.castShadow = true; o.receiveShadow = true; });
}
function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); }
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.__dbg = () => { const g = root.children[0] && root.children[0].geometry;
  const bb = g ? (g.computeBoundingBox(), g.boundingBox) : null;
  return {M, verts: g ? g.attributes.position.count : 0,
          box: bb ? [bb.min, bb.max].map(v => [v.x, v.y, v.z].map(n => +n.toFixed(3))) : null,
          missing: [...MISSING]}; };
window.__set = (item,rot,view)=>{ if(ITEMS[item])ITEM=item; if(rots.includes(rot))ROT=rot; rebuild(); if(VIEWS[view])setView(view); };
</script>
</body>
