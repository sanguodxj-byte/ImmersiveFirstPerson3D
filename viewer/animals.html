<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.js';

// ===========================================================================
// 动物程序化 3D 建模检查页（与 Source/RimFirstPerson3D/Animal3D.cs 逐项同源）
//
// 1. 材质与分色：只从 ./animal_uv.json 与 ./animal_atlas.png 读取（由
//    scripts/animal_atlas.py 从原版 _east / _south / _north 三视图及遮罩提取）：
//      0=coat, 1=belly, 2=head, 3=limb, 4=detail, 5=eye
// 2. 几何与描边壳：直接复刻 Model3D.cs 的 ModelBuilder（AddBox / AddCylinder 含
//    taper 锥度 / AddSphere / ToHull 逐部件法线平均外扩反绕壳）与 Animal3D.cs
//    的 19 类解剖配方。
// ===========================================================================
const VER = 'rebuild1';
const UV_COAT = 0, UV_BELLY = 1, UV_HEAD = 2, UV_LIMB = 3, UV_DETAIL = 4, UV_EYE = 5;
const REGIONS = ['coat', 'belly', 'head', 'limb', 'detail', 'eye'];

const uvJson = await (await fetch('./animal_uv.json?' + VER)).json();
const tex = await new Promise((resolve) => {
  new THREE.TextureLoader().load('./animal_atlas.png?' + VER, t => resolve(t), undefined, () => resolve(null));
});
if (tex) {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.flipY = false;
}
const matAtlas = new THREE.MeshLambertMaterial({
  map: tex, side: THREE.FrontSide,
  stencilWrite: true, stencilRef: 1,
  stencilFunc: THREE.AlwaysStencilFunc,
  stencilZPass: THREE.ReplaceStencilOp
});
const matHull  = new THREE.MeshBasicMaterial({
  color: 0x12131a, side: THREE.FrontSide,
  stencilWrite: true, stencilRef: 1,
  stencilFunc: THREE.NotEqualStencilFunc
});

const MISSING = new Set();
function getUvRect(spKey, regIdx) {
  const rName = REGIONS[regIdx] || 'coat';
  const key = `${spKey}.${rName}`;
  const a = uvJson.uv[key];
  if (!a) {
    MISSING.add(key);
    return [0.42, 0.42, 0.58, 0.58];
  }
  // animal_uv.json 为 Unity 口径 [u0, v0, u1, v1]（v=1-y/H）；flipY=false 下翻回 [u0, 1-v1, u1, 1-v0]
  return [a[0], 1 - a[3], a[2], 1 - a[1]];
}

const Has = (s, ...ks) => ks.some(k => s.includes(k));

export function archOf(n) {
  if (Has(n, 'thrumbo')) return 'Thrumbo';
  if (Has(n, 'boomalope', 'toxalope')) return 'SacUngulate';
  if (Has(n, 'dromedary', 'camel', 'alpaca', 'llama')) return 'Camelid';
  if (Has(n, 'muffalo', 'bison', 'yak', 'muskox', 'sheep')) return 'WoollyUngulate';
  if (Has(n, 'elephant', 'mastodon', 'rhino', 'hippo')) return 'Pachyderm';
  if (Has(n, 'penguin')) return 'Penguin';
  if (Has(n, 'ostrich', 'emu', 'cassowary', 'flamingo', 'heron', 'crane', 'stork')) return 'TallBird';
  if (Has(n, 'chicken', 'duck', 'goose', 'swan', 'turkey', 'peacock', 'quail', 'sparrow', 'crow', 'bluebird', 'macaw', 'parrot', 'pigeon', 'toucan', 'vulture', 'raven', 'owl', 'eagle', 'hawk', 'bird')) return 'BirdFowl';
  if (Has(n, 'tortoise', 'seaturtle', 'turtle', 'armadillo', 'hermitcrab', 'stonecrab', 'crab', 'lavasnail', 'snail', 'slug')) return 'ShellCreature';
  if (Has(n, 'cobra', 'snake', 'serpent', 'viper')) return 'Serpent';
  if (Has(n, 'megaspider', 'spelopede', 'megascarab', 'spider', 'scarab', 'insect', 'beetle', 'megaworm')) return 'Insectoid';
  if (Has(n, 'iguana', 'monitor', 'lizard', 'gecko', 'skink', 'komodo', 'alligator', 'croc', 'gator', 'bullfrog', 'colossustoad', 'frog', 'toad', 'salamander', 'newt', 'walrus', 'seal', 'sealion')) return 'ReptileAmphibian';
  if (Has(n, 'monkey', 'gorilla', 'ape', 'chimp', 'baboon', 'dryad')) return 'PrimateDryad';
  if (Has(n, 'bear', 'panda', 'megasloth', 'badger', 'wolverine')) return 'UrsineSloth';
  if (Has(n, 'hare', 'snowhare', 'rabbit', 'squirrel', 'beaver', 'raccoon', 'capybara', 'chinchilla', 'guineapig', 'rat', 'boomrat', 'wasterat', 'porcupine', 'otter', 'mink', 'prairie', 'vole', 'hamster')) return 'RodentSmall';
  if (Has(n, 'pig', 'wildboar', 'boar')) return 'Porcine';
  if (Has(n, 'fox', 'wolf', 'warg', 'husky', 'labrador', 'terrier', 'hound', 'dog')) return 'Canid';
  if (Has(n, 'horse', 'donkey', 'deer', 'elk', 'caribou', 'moose', 'ibex', 'goat', 'gazelle', 'antelope', 'cow', 'bull')) return 'CervidEquine';
  if (Has(n, 'cat', 'cougar', 'panther', 'lynx', 'tiger')) return 'Felid';
  return 'Canid';
}

function calibrateWidth(n, bl, defaultBw) {
  const prop = uvJson.species && uvJson.species[n];
  if (prop && prop.eastW > 0.05) {
    const ratio = Math.min(0.78, Math.max(0.36, prop.southW / prop.eastW));
    const measuredBw = bl * ratio * 0.92;
    return defaultBw + (measuredBw - defaultBw) * 0.65;
  }
  return defaultBw;
}

// ---------------------------------------------------------------- 欧拉旋转与 ModelBuilder 同源复刻
// Unity Quaternion.Euler(pitch, yaw, roll) 顺序为 Z(roll) -> X(pitch) -> Y(yaw)
function rotVec(v, pitch, yaw, roll) {
  const rx = pitch * Math.PI / 180;
  const ry = yaw   * Math.PI / 180;
  const rz = roll  * Math.PI / 180;
  const cx = Math.cos(rx), sx = Math.sin(rx);
  const cy = Math.cos(ry), sy = Math.sin(ry);
  const cz = Math.cos(rz), sz = Math.sin(rz);
  // 1) Z(roll)
  const x1 = v[0] * cz - v[1] * sz;
  const y1 = v[0] * sz + v[1] * cz;
  const z1 = v[2];
  // 2) X(pitch)
  const x2 = x1;
  const y2 = y1 * cx - z1 * sx;
  const z2 = y1 * sx + z1 * cx;
  // 3) Y(yaw)
  const x3 =  x2 * cy + z2 * sy;
  const y3 =  y2;
  const z3 = -x2 * sy + z2 * cy;
  return [x3, y3, z3];
}

function stepVec(len, pitch, yaw = 0, roll = 0) {
  return rotVec([0, len, 0], pitch, yaw, roll);
}

function add3(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

function createModel() {
  const parts = [];
  const m = {
    parts,
    add(kind, pos, size, opt = {}) {
      parts.push({
        kind,
        pos: [pos[0], pos[1], pos[2]],
        size: [size[0], size[1], size[2]],
        yaw: opt.yaw || 0,
        pitch: opt.pitch || 0,
        roll: opt.roll || 0,
        taper: opt.taper || 0,
        uv: opt.uv !== undefined ? opt.uv : UV_COAT,
        noOutline: !!opt.noOutline,
        noTop: !!opt.noTop,
        noBottom: !!opt.noBottom,
      });
    }
  };
  return m;
}

function addSymX(m, kind, x, y, z, size, opt = {}) {
  const yaw = opt.yaw || 0, pitch = opt.pitch || 0, splay = opt.splay || 0, taper = opt.taper || 0;
  const uv = opt.uv !== undefined ? opt.uv : UV_COAT, noOutline = !!opt.noOutline;
  m.add(kind, [-x, y, z], size, { yaw: -yaw, pitch, roll:  splay, taper, uv, noOutline });
  m.add(kind, [ x, y, z], size, { yaw:  yaw, pitch, roll: -splay, taper, uv, noOutline });
}

function addSeg(m, p0, len, d0, d1, pitch, yaw = 0, roll = 0, uv = UV_COAT, joint = true, noOutline = false) {
  if (joint) {
    m.add('sph', [p0[0], p0[1] - d0 * 0.44, p0[2]], [d0 * 0.88, d0 * 0.82, d0 * 0.88], { uv, noOutline: true });
  }
  const taper = d0 > 0.0001 ? Math.min(1.8, Math.max(0.04, d1 / d0)) : 1.0;
  m.add('cyl', p0, [d0, len, d0], { yaw, pitch, roll, taper, uv, noOutline });
  return add3(p0, stepVec(len * 0.88, pitch, yaw, roll));
}

function addSymSeg(m, pair, len, d0, d1, pitch, splay, yaw = 0, uv = UV_DETAIL, joint = true, noOutline = false) {
  pair.L = addSeg(m, pair.L, len, d0, d1, pitch, -yaw,  splay, uv, joint, noOutline);
  pair.R = addSeg(m, pair.R, len, d0, d1, pitch,  yaw, -splay, uv, joint, noOutline);
}

function buildQuadBody(m, L, bl, bh, bw, legH, legD, chestLift, rumpScale, frontLegUv = UV_LIMB, rearLegUv = UV_LIMB, bellyUv = UV_BELLY, opt = {}) {
  const waistDip = opt.waistDip || 0;
  const tuckUp = opt.tuckUp || 0;
  const fz = bl * 0.18, rz = -bl * 0.20;
  const chestUv = (frontLegUv === UV_BELLY || bellyUv === UV_COAT) ? frontLegUv : UV_COAT;
  const midZ = (fz + rz) * 0.5;

  const frontH = bh + chestLift, rearH = bh * 0.95 * rumpScale;

  // 1. 唯一流线型主躯干（全身唯一的带外轮廓椭球，从颈根到臀尖全线圆顺包裹，彻底消除多节块状拼接与分段感）
  const bodyH = Math.max(frontH, rearH) * 0.98 - waistDip * 0.30;
  const bodyY = Math.max(0, tuckUp * 0.20);
  m.add('sph', [0, bodyY, midZ], [bw * 0.98, bodyH, bl * 0.96], { uv: UV_COAT });

  // 2. 内部深胸与后臀体块（全部 noOutline: true，只充填肌肉体积，绝不在外表产生阶梯隆起与分节黑环）
  m.add('sph', [0, 0, fz], [bw * 0.92, frontH * 0.92, bl * 0.46], { uv: chestUv, noOutline: true });
  m.add('sph', [0, Math.max(0, tuckUp * 0.25), rz], [bw * 0.90 * rumpScale, rearH * 0.92, bl * 0.46], { uv: UV_COAT, noOutline: true });

  // 3. 内部背腹平滑顺延层（高度严格收敛在主躯干内部，消除侧视中段突兀隆起）
  const bridgeH = Math.min(bodyH * 0.95, (frontH + rearH) * 0.48 - waistDip);
  m.add('sph', [0, Math.max(0, tuckUp * 0.25), midZ], [bw * 0.88, bridgeH, bl * 0.82], { uv: UV_COAT, noOutline: true });

  // 4. 侧身肋部贴合
  const sx = bw * 0.14;
  addSymX(m, 'sph', sx, 0, fz * 0.85, [bw * 0.46, frontH * 0.85, bl * 0.48], { uv: chestUv, noOutline: true });
  addSymX(m, 'sph', sx, Math.max(0, tuckUp * 0.35), rz * 0.85, [bw * 0.44 * rumpScale, rearH * 0.83, bl * 0.48], { uv: UV_COAT, noOutline: true });

  return {
    chestTop: [0, chestLift + bh * 0.64, bl * 0.32],
    tailBase: [0, bh * 0.52 * rumpScale, -bl * 0.44],
  };
}

function buildHead(m, headCenter, hr, snoutLen, snoutW, snoutH, headUv = UV_HEAD, snoutUv = UV_HEAD, jawUv = UV_BELLY, hasNose = true) {
  const pitch = 112;
  const tilt = pitch - 90;

  m.add('sph', [headCenter[0], headCenter[1] - hr * 0.25, headCenter[2] - hr * 0.02], [hr * 0.84, hr * 0.68, hr * 0.90], { uv: headUv });
  m.add('sph', [headCenter[0], headCenter[1] - hr * 0.44, headCenter[2]], [hr * 0.90, hr * 0.88, hr * 0.96], { noOutline: true, uv: headUv });

  const cSnout = add3([headCenter[0], headCenter[1] - hr * 0.10, headCenter[2] + hr * 0.12], stepVec(snoutLen * 0.22, pitch));
  const sx = Math.max(snoutW * 1.32, hr * 0.74);
  const sy = Math.max(snoutH * 1.22, hr * 0.58);
  const sz = snoutLen * 1.54;
  const sxCore = Math.max(0.02, sx - 0.022);
  const syCore = Math.max(0.02, sy - 0.022);
  const szCore = Math.max(0.02, sz - 0.022);
  const offCore = stepVec(syCore * 0.5, tilt);
  const offSkin = stepVec(sy * 0.5, tilt);
  m.add('sph', [cSnout[0] - offCore[0], cSnout[1] - offCore[1], cSnout[2] - offCore[2]],
    [sxCore, syCore, szCore], { pitch: tilt, uv: snoutUv });
  m.add('sph', [cSnout[0] - offSkin[0], cSnout[1] - offSkin[1], cSnout[2] - offSkin[2]],
    [sx, sy, sz], { pitch: tilt, noOutline: true, uv: snoutUv });

  if (jawUv !== snoutUv) {
    const cJaw = [cSnout[0], cSnout[1] - sy * 0.14, cSnout[2] - hr * 0.04];
    const hJaw = sy * 0.64;
    const offJaw = stepVec(hJaw * 0.5, tilt);
    m.add('sph', [cJaw[0] - offJaw[0], cJaw[1] - offJaw[1], cJaw[2] - offJaw[2]],
      [sx * 0.95, hJaw, sz * 0.90], { pitch: tilt, noOutline: true, uv: jawUv });
  }

  const cBridge = [headCenter[0], headCenter[1] - hr * 0.05, headCenter[2] + hr * 0.18];
  const hBridge = hr * 0.74;
  const offBridge = stepVec(hBridge * 0.5, tilt * 0.6);
  m.add('sph', [cBridge[0] - offBridge[0], cBridge[1] - offBridge[1], cBridge[2] - offBridge[2]],
    [hr * 0.86, hBridge, hr * 0.78], { pitch: tilt * 0.6, noOutline: true, uv: headUv });

  if (hasNose) {
    const noseCenter = add3(add3(cSnout, stepVec(sz * 0.48, pitch)), [0, sy * 0.06, 0]);
    const nh = sy * 0.28;
    m.add('sph', [noseCenter[0], noseCenter[1] - nh * 0.5, noseCenter[2]],
      [sx * 0.30, nh, sx * 0.28], { uv: UV_EYE, noOutline: true });
  }
  addSymX(m, 'sph', hr * 0.36, headCenter[1] - hr * 0.02, headCenter[2] + hr * 0.28,
    [hr * 0.19, hr * 0.21, hr * 0.21], { uv: UV_EYE, noOutline: true });
}

function buildUngulateHead(m, headCenter, hr, muzzleLen, muzzleW, muzzleH, headUv = UV_HEAD, muzzleUv = UV_HEAD, jawUv = UV_BELLY, pitch = 118) {
  const tilt = pitch - 90;
  // 贯穿整个头脸的长楔形主轮廓（头部全线仅此一个外轮廓描边，从脑后到吻端自然一体，彻底消除面颊与吻部的任何断层折角）
  const cFullHead = add3(headCenter, stepVec(muzzleLen * 0.16, pitch));
  const fullLen = hr * 0.95 + muzzleLen * 1.35;
  const fullW = Math.max(muzzleW * 1.35, hr * 0.82);
  const fullH = Math.max(muzzleH * 1.25, hr * 0.68);
  const offFull = stepVec(fullH * 0.45, tilt);
  m.add('sph', [cFullHead[0] - offFull[0], cFullHead[1] - offFull[1], cFullHead[2] - offFull[2]],
    [fullW, fullH, fullLen], { pitch: tilt, uv: headUv });

  // 内部饱满后颅（noOutline: true）
  m.add('sph', [headCenter[0], headCenter[1] - hr * 0.42, headCenter[2]], [hr * 0.88, hr * 0.86, hr * 0.94], { noOutline: true, uv: headUv });

  // 内部顺滑口吻与鼻端（noOutline: true）
  const cMuzzle = add3([headCenter[0], headCenter[1] - hr * 0.08, headCenter[2] + hr * 0.12], stepVec(muzzleLen * 0.32, pitch));
  const sx = Math.max(muzzleW * 1.22, hr * 0.70);
  const sy = Math.max(muzzleH * 1.15, hr * 0.58);
  const sz = muzzleLen * 1.45;
  const offSkin = stepVec(sy * 0.5, tilt);
  m.add('sph', [cMuzzle[0] - offSkin[0], cMuzzle[1] - offSkin[1], cMuzzle[2] - offSkin[2]],
    [sx, sy, sz], { pitch: tilt, noOutline: true, uv: headUv });

  if (muzzleUv !== headUv) {
    const cTip = add3(cMuzzle, stepVec(sz * 0.20, pitch));
    const hTip = sy * 0.90;
    const offTip = stepVec(hTip * 0.5, tilt);
    m.add('sph', [cTip[0] - offTip[0], cTip[1] - offTip[1], cTip[2] - offTip[2]],
      [sx * 0.92, hTip, sz * 0.65], { pitch: tilt, noOutline: true, uv: muzzleUv });
  }

  // 眼睛位于额骨两侧，耳朵前方
  addSymX(m, 'sph', hr * 0.36, headCenter[1] + hr * 0.04, headCenter[2] + hr * 0.04, [hr * 0.16, hr * 0.16, hr * 0.18], { uv: UV_EYE, noOutline: true });
}

function buildEars(m, headCenter, hr, earW, earH, opt = {}) {
  const floppy = !!opt.floppy, roundEar = !!opt.roundEar, tufted = !!opt.tufted;
  const earUv = opt.earUv !== undefined ? opt.earUv : UV_LIMB;
  if (floppy) {
    addSymX(m, 'sph', hr * 0.46, headCenter[1] - hr * 0.40, headCenter[2] - hr * 0.04,
      [earW * 0.9, earH * 1.15, earW * 0.65], { yaw: 12, splay: 18, uv: earUv });
  } else if (roundEar) {
    addSymX(m, 'sph', hr * 0.35, headCenter[1] + hr * 0.34, headCenter[2] - hr * 0.08,
      [earW * 1.05, earH * 0.88, earW * 0.42], { yaw: 12, splay: 22, uv: earUv, noOutline: true });
  } else {
    const longEar = earH > 0.20 * (hr / 0.22);
    const sp = longEar ? 18 : 24;
    const pt = longEar ? -32 : -12;
    const pair = {
      L: [headCenter[0] - hr * 0.28, headCenter[1] + hr * 0.08, headCenter[2] - hr * 0.06],
      R: [headCenter[0] + hr * 0.28, headCenter[1] + hr * 0.08, headCenter[2] - hr * 0.06],
    };
    addSymSeg(m, pair, earH * 1.22, earW, earW * 0.24, pt, sp, 0, earUv, false);
    if (tufted) addSymSeg(m, pair, earH * 0.52, earW * 0.32, earW * 0.08, pt + 10, sp * 1.8, 0, UV_EYE, false, true);
  }
}

// ---------------------------------------------------------------- 19 类解剖配方（与 Animal3D.cs 1:1 同步）
export function buildAnimalModel(n, a, L) {
  const m = createModel();
  switch (a) {
    case 'Thrumbo': {
      const alpha = Has(n, 'alpha');
      const bl = 0.72 * L, bh = 0.46 * L, bw = calibrateWidth(n, bl, 0.36 * L);
      const { chestTop, tailBase } = buildQuadBody(m, L, bl, bh, bw, 0, 0.10 * L, 0.08 * L, 0.86, UV_COAT, UV_COAT, UV_COAT);
      // 雪白通体神兽躯干，顺滑覆盖肩背与双胁的雪白厚毛披肩
      addSymX(m, 'sph', bw * 0.20, bh * 0.18, 0.02 * L, [bw * 0.54, bh * 0.74, bl * 0.72], { uv: UV_COAT, noOutline: true });
      // 原版胸前标志性锯齿白披肩与前胸毛绺（带独立清晰轮廓）
      m.add('sph', [0, bh * 0.12, bl * 0.24], [bw * 0.58, bh * 0.76, bl * 0.38], { uv: UV_COAT });
      addSymX(m, 'cone', bw * 0.22, bh * 0.12, bl * 0.22, [0.065 * L, 0.16 * L, 0.075 * L], { pitch: 18, splay: 28, taper: 0.18, uv: UV_COAT });

      // 腹底标志性白毛锯齿毛帘（4簇沿腹底边缘排布的下垂毛锥）
      for (let i = 0; i < 4; i++) {
        const fz = (0.16 - i * 0.11) * L;
        m.add('cone', [0, 0.065 * L, fz], [0.055 * L, 0.046 * L, 0.065 * L], { pitch: -168, taper: 0.18, uv: UV_COAT, noOutline: true });
      }

      // 自然平顺的微 S 形长颈（前倾角从36°渐变至18°，神兽姿态自然昂首前倾）

        // 额前两侧向前下方内拢的双螯（大螯在外，小触角在内偏下，错开分布0穿模）

  return m;
}

// ---------------------------------------------------------------- ModelBuilder 顶点与反绕描边壳生成（同 Model3D.cs）
function compileMesh(spKey, m, outlineW) {
  const pos = [], norms = [], uvs = [], idx = [];
  const hPos = [], hIdx = [];
  const partBoxes = [];

  for (const p of m.parts) {
    const rect = getUvRect(spKey, p.uv);
    const mapU = u => rect[0] + (rect[2] - rect[0]) * Math.min(1, Math.max(0, u));
    const mapV = v => rect[1] + (rect[3] - rect[1]) * Math.min(1, Math.max(0, v));
    const xform = lp => add3(p.pos, rotVec(lp, p.pitch, p.yaw, p.roll));

    const pVerts = [], pUvs = [], pTris = [];
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
    const vtx = (lp, uv) => {
      const wp = xform(lp);
      if (wp[0] < x0) x0 = wp[0]; if (wp[0] > x1) x1 = wp[0];
      if (wp[1] < y0) y0 = wp[1]; if (wp[1] > y1) y1 = wp[1];
      if (wp[2] < z0) z0 = wp[2]; if (wp[2] > z1) z1 = wp[2];
      pVerts.push(wp);
      pUvs.push([mapU(uv[0]), mapV(uv[1])]);
      return pVerts.length - 1;
    };
    const tri = (a, b, c) => { pTris.push(a, b, c); };
    const quad = (a, b, c, d, ua, ub, uc, ud) => {
      const i0 = vtx(a, ua), i1 = vtx(b, ub), i2 = vtx(c, uc), i3 = vtx(d, ud);
      pTris.push(i0, i1, i2, i0, i2, i3);
    };

    const [sx, sy, sz] = p.size;
    if (p.kind === 'box') {
      const hx = sx * 0.5, hz = sz * 0.5, hy = sy;
      quad([-hx, 0, -hz], [-hx, hy, -hz], [ hx, hy, -hz], [ hx, 0, -hz], [0,0],[0,1],[1,1],[1,0]);
      quad([ hx, 0,  hz], [ hx, hy,  hz], [-hx, hy,  hz], [-hx, 0,  hz], [0,0],[0,1],[1,1],[1,0]);
      quad([-hx, 0,  hz], [-hx, hy,  hz], [-hx, hy, -hz], [-hx, 0, -hz], [0,0],[0,1],[1,1],[1,0]);
      quad([ hx, 0, -hz], [ hx, hy, -hz], [ hx, hy,  hz], [ hx, 0,  hz], [0,0],[0,1],[1,1],[1,0]);
      quad([-hx, hy, -hz], [-hx, hy,  hz], [ hx, hy,  hz], [ hx, hy, -hz], [0,0],[0,1],[1,1],[1,0]);
      quad([-hx, 0,  hz], [-hx, 0, -hz], [ hx, 0, -hz], [ hx, 0,  hz], [0,0],[0,1],[1,1],[1,0]);
    } else if (p.kind === 'cyl' || p.kind === 'cone') {
      const seg = 12, cone = p.kind === 'cone';
      const r = sx * 0.5, rz = (sz > 0.001 ? sz : sx) * 0.5, h = sy;
      const ratio = p.taper > 0.001 ? p.taper : (cone ? 0.02 : 1.0);
      const topR = r * ratio, topRz = rz * ratio;
      for (let i = 0; i < seg; i++) {
        const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
        const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
        quad([c0 * r, 0, s0 * rz], [c0 * topR, h, s0 * topRz], [c1 * topR, h, s1 * topRz], [c1 * r, 0, s1 * rz],
          [i / seg, 0], [i / seg, 1], [(i + 1) / seg, 1], [(i + 1) / seg, 0]);
      }
      if (!cone && !p.noTop && ratio > 0.08) {
        const tc = vtx([0, h, 0], [0.5, 0.5]);
        for (let i = 0; i < seg; i++) {
          const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
          const v0 = vtx([Math.cos(a0) * topR, h, Math.sin(a0) * topRz], [0.5 + Math.cos(a0) * 0.45, 0.5 + Math.sin(a0) * 0.45]);
          const v1 = vtx([Math.cos(a1) * topR, h, Math.sin(a1) * topRz], [0.5 + Math.cos(a1) * 0.45, 0.5 + Math.sin(a1) * 0.45]);
          tri(tc, v1, v0);
        }
      }
      if (!p.noBottom) {
        const bc = vtx([0, 0, 0], [0.5, 0.5]);
        for (let i = 0; i < seg; i++) {
          const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
          const v0 = vtx([Math.cos(a0) * r, 0, Math.sin(a0) * rz], [0.5, 0.5]);
          const v1 = vtx([Math.cos(a1) * r, 0, Math.sin(a1) * rz], [0.5, 0.5]);
          tri(bc, v0, v1);
        }
      }
    } else {
      const lon = 24, lat = 16;
      const rx = sx * 0.5, ry = sy * 0.5, rz = sz * 0.5;
      for (let iy = 0; iy < lat; iy++) {
        const v0 = (iy / lat) * Math.PI, v1 = ((iy + 1) / lat) * Math.PI;
        const y0s = ry - Math.cos(v0) * ry, y1s = ry - Math.cos(v1) * ry;
        const r0 = Math.sin(v0), r1 = Math.sin(v1);
        for (let ix = 0; ix < lon; ix++) {
          const u0 = (ix / lon) * Math.PI * 2, u1 = ((ix + 1) / lon) * Math.PI * 2;
          const p00 = [Math.cos(u0) * r0 * rx, y0s, Math.sin(u0) * r0 * rz];
          const p10 = [Math.cos(u1) * r0 * rx, y0s, Math.sin(u1) * r0 * rz];
          const p11 = [Math.cos(u1) * r1 * rx, y1s, Math.sin(u1) * r1 * rz];
          const p01 = [Math.cos(u0) * r1 * rx, y1s, Math.sin(u0) * r1 * rz];
          const suv = pt => [
            0.5 + 0.45 * (rx > 0.001 ? pt[0] / rx : 0),
            0.5 + 0.45 * (ry > 0.001 ? (pt[1] - ry) / ry : 0),
          ];
          quad(p00, p01, p11, p10, suv(p00), suv(p01), suv(p11), suv(p10));
        }
      }
    }

    partBoxes.push({ k: p.kind, uv: p.uv, noOutline: !!p.noOutline, x0, x1, y0, y1, z0, z1 });

    // 逐部件平滑法线计算与反绕描边壳（与 ModelBuilder.ToHull 完全同口径）
    const avg = pVerts.map(() => [0, 0, 0]);
    const keyOf = v => `${Math.round(v[0]*1000)},${Math.round(v[1]*1000)},${Math.round(v[2]*1000)}`;
    const groups = new Map();
    for (let i = 0; i < pVerts.length; i++) {
      const k = keyOf(pVerts[i]);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    }
    for (let i = 0; i < pTris.length; i += 3) {
      const ia = pTris[i], ib = pTris[i + 1], ic = pTris[i + 2];
      const pa = pVerts[ia], pb = pVerts[ib], pc = pVerts[ic];
      const ux = pb[0] - pa[0], uy = pb[1] - pa[1], uz = pb[2] - pa[2];
      const vx = pc[0] - pa[0], vy = pc[1] - pa[1], vz = pc[2] - pa[2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      avg[ia][0] += nx; avg[ia][1] += ny; avg[ia][2] += nz;
      avg[ib][0] += nx; avg[ib][1] += ny; avg[ib][2] += nz;
      avg[ic][0] += nx; avg[ic][1] += ny; avg[ic][2] += nz;
    }

    // 写入主体网格（曲面部用平滑顶点法线，方盒保留棱角法线）
    const baseV = pos.length / 3;
    for (let i = 0; i < pVerts.length; i++) {
      pos.push(pVerts[i][0], pVerts[i][1], pVerts[i][2]);
      uvs.push(pUvs[i][0], pUvs[i][1]);
      if (p.kind === 'box') {
        const len = Math.hypot(avg[i][0], avg[i][1], avg[i][2]) || 1;
        norms.push(avg[i][0] / len, avg[i][1] / len, avg[i][2] / len);
      } else {
        const g = groups.get(keyOf(pVerts[i]));
        let sxn = 0, syn = 0, szn = 0;
        for (const gi of g) { sxn += avg[gi][0]; syn += avg[gi][1]; szn += avg[gi][2]; }
        const len = Math.hypot(sxn, syn, szn) || 1;
        norms.push(sxn / len, syn / len, szn / len);
      }
    }
    for (let i = 0; i < pTris.length; i++) idx.push(baseV + pTris[i]);

    if (!p.noOutline && outlineW > 0) {
      const hBase = hPos.length / 3;
      for (let i = 0; i < pVerts.length; i++) {
        const g = groups.get(keyOf(pVerts[i]));
        let sxn = 0, syn = 0, szn = 0;
        for (const gi of g) { sxn += avg[gi][0]; syn += avg[gi][1]; szn += avg[gi][2]; }
        const len = Math.hypot(sxn, syn, szn) || 1;
        hPos.push(
          pVerts[i][0] + (sxn / len) * outlineW,
          pVerts[i][1] + (syn / len) * outlineW,
          pVerts[i][2] + (szn / len) * outlineW
        );
      }
      for (let i = 0; i < pTris.length; i += 3) {
        hIdx.push(hBase + pTris[i], hBase + pTris[i + 2], hBase + pTris[i + 1]);
      }
    }
  }

  const bodyGeo = new THREE.BufferGeometry();
  bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bodyGeo.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));
  bodyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  bodyGeo.setIndex(idx);

  const hullGeo = new THREE.BufferGeometry();
  hullGeo.setAttribute('position', new THREE.Float32BufferAttribute(hPos, 3));
  hullGeo.setIndex(hIdx);

  return { bodyGeo, hullGeo, partBoxes };
}

function buildOneGroup(name, overrideL = null) {
  const ds = DS_MAP[name] || 1.4;
  const L = overrideL !== null ? overrideL : Math.min(4.5, Math.max(0.45, ds * 0.72));
  const a = archOf(name);
  const m = buildAnimalModel(name, a, L);
  const ow = 0.022 * Math.min(2.2, Math.max(0.6, L));
  const { bodyGeo, hullGeo, partBoxes } = compileMesh(name, m, ow);
  const grp = new THREE.Group();
  const bodyMesh = new THREE.Mesh(bodyGeo, matAtlas);
  const hullMesh = new THREE.Mesh(hullGeo, matHull);
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  bodyMesh.renderOrder = 1;
  hullMesh.renderOrder = 2;
  grp.add(bodyMesh);
  grp.add(hullMesh);
  return { grp, L, a, partBoxes, bodyGeo };
}

function focus() {
  if (!root) return;
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 0.5);
  const r = span * 1.62;
  const o = (VIEWS[curV] || VIEWS['45°']).off;
  camera.position.set(center.x + o[0] * r, center.y + o[1] * r, center.z + o[2] * r);
  controls.target.copy(center);
  controls.update();
}

function updateHud(name, a, L, nParts) {
  if (STILL || GALLERY || PARTS) return;
  const hud = document.getElementById('hud');
  hud.innerHTML =
    `<b>${name}</b> · 原型 <b>${a}</b> · 视图 <b>${curV}</b><br>` +
    `体量 L = ${L.toFixed(2)}m · 解剖部件数 <b>${nParts}</b><br>` +
    `纹理图集 ${uvJson.size[0]}x${uvJson.size[1]}（6 区：coat / belly / head / limb / detail / eye）` +
    (MISSING.size ? `<br><b style="color:#ff8f8f">缺取样区 ${[...MISSING].join(' ')}</b>` : '');
}

function show(name) {
  hideChrome();
  if (root) {
    scene.remove(root);
    root.traverse(o => { o.geometry?.dispose?.(); });
  }
  MISSING.clear();
  const { grp, L, a, partBoxes } = buildOneGroup(name);
  root = grp;
  curL = L;
  scene.add(root);
  focus();
  updateHud(name, a, L, partBoxes.length);
}

    for (let c = 0; c < viewKeys.length; c++) {
      const o = SINGLE_VIEWS[viewKeys[c]].off;
      camera.position.set(center.x + o[0] * dist, center.y + o[1] * dist, center.z + o[2] * dist);
      L1.position.set(o[0] * 5 + 1.2, 6.5, o[2] * 5 + 1.2);
      L2.position.set(-o[0] * 4, 3.0, -o[2] * 4);
      camera.lookAt(center);
      const wx = c * CW;
      renderer.setViewport(wx, wy, CW, CH);
      renderer.setScissor(wx, wy, CW, CH);
      renderer.render(scene, camera);
    }
    scene.remove(grp);
    grp.traverse(o => { o.geometry?.dispose?.(); });
  }
} else {
  show(curSp);
  [...vbar.children].forEach(x => x.classList.toggle('on', x.dataset.v === curV));
  [...sbar.children].forEach(x => x.classList.toggle('on', x.dataset.s === curSp));
}

function loop() {
  if (SHEET !== null || PARTS || SINGLE) return;
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();

addEventListener('resize', () => {
  if (SINGLE || SHEET !== null || PARTS) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
