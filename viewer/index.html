<!DOCTYPE html>

<style>
  html,body{margin:0;height:100%;background:#1c1e26;font-family:Consolas,monospace}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:10px;top:8px;color:#cfd6e4;font-size:12px;line-height:1.6;
       background:rgba(0,0,0,.5);padding:9px 11px;border-radius:4px;z-index:9}
  #hud b{color:#7fd1ff}
  #forms{position:fixed;right:10px;top:44px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
  #views{position:fixed;right:10px;top:8px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;
         justify-content:flex-end;max-width:62vw}
  button{background:#2e3446;color:#cfd6e4;border:1px solid #4a5568;border-radius:3px;
         padding:5px 9px;font-size:12px;cursor:pointer}
  button:hover{background:#3d465c}
  button.on{background:#2f6f4f;border-color:#57b487;color:#eafff4}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="views"></div>
<div id="forms"></div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.js';

// ============================================================
//  UV 切分坐标 —— 由tex.png 逐像素行放大判读得出
//  源图 80x80，内容 y=12..66，横向满宽，黑边已剥离
//    俯视段 y=12..44  深灰顶面+ 下沿浅灰带
//    侧视段 y=45..66  砖缝 + 三层白砖（错缝）
//    分界y=44/45 之间 -> v = 1 - 44/80 = 0.45
//  v 口径：v = 1 - y/80（y 从图像顶部算）
// ============================================================
// tex.flipY = false  =>  UV 的 v 直接等于「从图像底边起算的比例」= y/80
//   俯视段 y=12..44  ->  v = 0.150 .. 0.550
//   侧视段 y=45..66  ->  v = 0.5625 .. 0.825
// y=45 那行亮度 186，是俯视与侧视之间的过渡行，横贯整幅。
// 它归俯视段-> 侧视段必须从 y=46 起，否则整段重复时每段都带一条灰线。
//   俯视段 y=12..45  ->  v = 0.150 .. 0.575
//   侧视段 y=46..66  ->  v = 0.575 .. 0.825
// y=45（亮度 186）是俯视与侧视的过渡行：归俯视则俯视出现砖纹，
// 归侧视则整段重复后每段带一条灰线。
// 解法：拆分线落在该行正中，两段都不完整包含它 ——
//   俯视 y=12..44（止于 45 行上沿）  v = 0.150 .. 0.55625
//   侧视 y=46..66（始于 45 行下沿）  v = 0.59375 .. 0.825
// 俯视段内部结构（逐行亮度）：
//   y=12 亮68 顶部深色描边  <- 深黑块，移除
//   y=13..15 亮134 上浅灰带 ┐
//   y=16..41 亮102 顶面主体├ 上下对称
//   y=42..44 亮134 下浅灰带 ┘
//   y=45 亮186 过渡行       <- 拆分线穿过它
// 去掉 y=12 后上下自然对称（各留一条 134 浅灰带）。
// 顶面：按图集行号定位（行1=A 上下灰边 / 行2=B 左右灰边 / 行3=C 单边）
// ---------------------------------------------------------------- 图集 UV
// 图集 atlas.png 128x128（4x4 格，每格 32x32）：
//   行0    = 立面砖循环段 y=0..20（21 行 x 80 列，原样不缩放）
//   行1..4 = 顶面 16 种连通性变体（4x4，与原版图集 16 格数量一致）
//
//顶面变体索引 = 北*8 + 南*4 + 西*2 + 东*1（1 = 该方向有墙，亮灰边保留）
// 所有 16 种都由同一份 32x32 真实顶面像素裁切/搬运得到，不自绘颜色。
// 图集实际尺寸 128x160（高= 32*(1+4行)）。
//
// **素材实测**：源格每行 80 列像素完全一致 -> 立面横向无变化，纵向整段平铺。
const VER = '$(date +%s)';       // 版本号：改代码后 URL 加 ?v=VER 强制刷新
const AW = 256, AH = 224;                         // 图集实际尺寸
const G = 32 / AW;                                 // 单格 UV 跨度 = 32/256 = 0.125
const ROW_H = 32 / AH;                             // 行跨度 = 32/224 = 0.142857
const FACE_V_ROW = 0;                              // 立面在第 0 行
const FACE_ROW = 0;                              // 立面在行0
const FACE_ROWS = 21;                            // 立面砖条21 行
const FACE_V = [0, FACE_ROWS / AH];              // v = [0, 0.1313]
const FUSE_W = 80 / AW;                          // 立面横向：80 列原样
// 连通性变体：idx = 北*8 + 南*4 + 西*2 + 东*1
// 图集位置 = 第 1+floor(idx/4) 行，第 idx%4 列
const topCellRect = (idx) => {
  const r = 1 + Math.floor(idx / 4), c = idx % 4;
  return { u0: c * CELL_U, u1: (c + 1) * CELL_U,
           v0: r * ROW_H,  v1: (r + 1) * ROW_H };
};
const CELL_U = 32 / AW;
// 连续段贴图：行5，左半=东西向（亮边在上下），右半=南北向（亮边在左右）
// 128列 = 4 格宽。运行时按段长取 u 子区间，**格子交界处不出现亮边**。
const STRIP_ROW = 5;
const STRIP_V= [STRIP_ROW * ROW_H, (STRIP_ROW + 1) * ROW_H];
const STRIP_LONG_COLS = 128;
// 段内UV：u0..u0+STRIP_LONG_COLS/AW，按段内偏移映射
function stripURange(horizontal){
  const base = horizontal ? 0 : STRIP_LONG_COLS / AW;
  return [base, base + STRIP_LONG_COLS / AW];
}

const H = 2.6, D = 1.0;            // 墙高 2.6 格，1x1 满格

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.setClearColor(0x1c1e26, 1);
app.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x1c1e26);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const d1 = new THREE.DirectionalLight(0xffffff, 0.72); d1.position.set(3,6,4); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.28); d2.position.set(-4,3,-3); scene.add(d2);

// 形态表：**侧视段坐标全部共用**（四格的立面砖布局完全相同，都是 y=46..66）。
// 只有顶面随形态不同：贴图不同、TOP_V 不同、缺角形状不同。
// 各形态只提供**顶面**贴图与顶面裁剪范围。
// 顶面段按每张贴图逐行判读（v = y/80，flipY=false）：
//   seg#6y=13..44   10#10 y=13..44   11#11 y=0..44   12#12 y=13..44
//   拆分线统一在 y=45（过渡行），下界去掉y=12 的深色描边
// 所有墙体共用**同一张图集** atlas.png：
//   侧面  -> FACE_V 区间（y=46..66）
//   顶面  -> TOP_V 区间（y=13..44）
// 顶面纹理是均匀灰，形态差异**只由几何缺角决定**，所以纹理天然连通。
// notch 只影响**顶面**几何。侧面完全锁死，不受形态影响。
// 墙体 = 格子集合。cells 是相邻格坐标(col,row)，几何按集合拼装。
// 顶面朝向由 TOP_ROT 决定（靠 UV 旋转，不改贴图像素）。
// cells 相邻的格子之间**不生成分隔立面**（否则连通墙体中间会多一道墙）。
const FORMS = {
  '8字形':{cells:[[0,0],[1,0]]},          // 两格东西相连
  'L形':    {cells:[[0,0],[0,1]]},          // 两格南北相连
  '十字形':  {cells:[[0,0],[1,0],[0,1]]},    // 三格 T
  '单格':    {cells:[[0,0]]},
  '长墙':    {cells:[[0,0],[1,0],[2,0]]},
  // ---- 16 种连通性变体的单格代表（用于逐一目检）----
  'V00':{cells:[[0,0]]},                          // 无连接
  'V01':{cells:[[0,0],[1,0]]},                    // E
  'V02':{cells:[[0,0],[-1,0]]},                   // W
  'V03':{cells:[[0,0],[1,0],[-1,0]]},             // WE（直墙东西）
  'V04':{cells:[[0,0],[0,-1]]},                   // S
  'V05':{cells:[[0,0],[0,-1],[1,0]]},             // SE（拐角）
  'V06':{cells:[[0,0],[0,-1],[-1,0]]},            // SW
  'V07':{cells:[[0,0],[0,-1],[1,0],[-1,0]]},      // SWE（长墙）
  'V08':{cells:[[0,0],[0,1]]},                    // N
  'V09':{cells:[[0,0],[0,1],[1,0]]},             // NE
  'V10':{cells:[[0,0],[0,1],[-1,0]]},            // NW
  'V11':{cells:[[0,0],[0,1],[1,0],[-1,0]]},      // NWE
  'V12':{cells:[[0,0],[0,1],[0,-1]]},            // NS（直墙南北）
  'V13':{cells:[[0,0],[0,1],[0,-1],[1,0]]},      // NSE
  'V14':{cells:[[0,0],[0,1],[0,-1],[-1,0]]},     // NSW
  'V15':{cells:[[0,0],[0,1],[0,-1],[1,0],[-1,0]]},// NSWE（十字）
};
let FORM = '8字形';
const tex = new THREE.TextureLoader().load('./atlas.png');
tex.colorSpace = THREE.SRGBColorSpace;
tex.magFilter = tex.minFilter = THREE.NearestFilter;
tex.generateMipmaps = false;
tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
tex.flipY = false;   // v 按「从图像顶部算」定义

const matTop = new THREE.MeshLambertMaterial({map:tex, alphaTest:0.5, side:THREE.FrontSide});
const matSide = new THREE.MeshLambertMaterial({map:tex, alphaTest:0.5, side:THREE.FrontSide});

// ---------------------------------------------------------------- 几何
// 侧面：与锁定版一致 —— 直接用整张形态贴图的 FACE_V 区间取样，不做裁剪。
// 段跨 = FACE_V 跨度（0.59375->0.8250 = 0.23125），段数 = round(墙高/段跨)。
const SIDE_WORLD_SPAN = 21 / 80;            // 立面 21 行砖条 = 0.2625 格
const faceSpan = SIDE_WORLD_SPAN;
let segW = faceSpan, segCount = 1;

function buildWall(w,h,d){
  segCount = Math.max(1, Math.round(h / segW));
  const step = h / segCount;
  // 每段 v恒为 FACE_V（锁定），不随段高缩放

  const mk = () => ({pos:[],uvs:[],idx:[]});
  const gT = mk(), gS = mk();
  const mkQuad=(G)=>(a,b,c,dd,ua,ub,va,vb)=>{
    const P=G.pos, U=G.uvs, I=G.idx;
    const push=(p,uv)=>{ P.push(p[0],p[1],p[2]); U.push(uv[0],uv[1]); return P.length/3-1; };
    const i0=push(a,[ua,va]), i1=push(b,[ub,va]),
          i2=push(c,[ub,vb]), i3=push(dd,[ua,vb]);
    I.push(i0,i1,i2, i0,i2,i3);
  };
  const qT = mkQuad(gT), qS = mkQuad(gS);

  const clampTo = (v,a,b) => Math.min(b, Math.max(a, v));
const range = (a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};

  const cells = FORMS[FORM].cells;
  const has = (c,r)=> cells.some(([cc,rr])=>cc===c && rr===r);

  // ---- 找出所有**连续墙段**（水平段 / 垂直段），顶面按整段铺，
  // 这样格子交界处不出现亮边，墙才连成一体。段内的亮边只画在两侧轮廓。
  const cellSet = new Set(cells.map(([a,b])=>a+','+b));
  const doneCell = new Set();
  const segs = [];
  for(const [c,r] of cells){
    const key=c+','+r;
    if(doneCell.has(key)) continue;
    // 向西延伸
    let c0=c; while(cellSet.has((c0-1)+','+r)) c0--;
    // 向东延伸
    let c1=c; while(cellSet.has((c1+1)+','+r)) c1++;
    // 向南延伸
    let r0=r; while(cellSet.has(c+','+(r0-1))) r0--;
    // 向北延伸
    let r1=r; while(cellSet.has(c+','+(r1+1))) r1++;
    if(c1>c0){ segs.push({horizontal:true,  cells:range(c0,c1).map(x=>[x,r])}); }
    if(r1>r0){ segs.push({horizontal:false, cells:range(r0,r1).map(y=>[c,y])}); }
    for(let x=c0;x<=c1;x++) doneCell.add(x+','+r);
    for(let y=r0;y<=r1;y++) doneCell.add(c+','+y);
  }

  for(const seg of segs){
    const hs = seg.horizontal;
    const len = seg.cells.length;
    const [su0, su1] = stripURange(hs);
    // 段的世界范围
    const cs = seg.cells;
    const xs = cs.map(([a])=>a), zs = cs.map(([,b])=>b);
    const x0=Math.min(...xs)*w, x1=(Math.max(...xs)+1)*w;
    const z0=Math.min(...zs)*d, z1=(Math.max(...zs)+1)*d;
    const P=(x,z)=>[x, h, z];
    // 沿段长方向取 u（连续），厚度方向取整段 v（亮边在两侧轮廓）
    const uAt = (x,z)=> hs ? su0 + (su1-su0)*((x-x0)/(x1-x0))
                           : su0 + (su1-su0)*((z-z0)/(z1-z0));
    const vAt = (x,z)=> hs ? (STRIP_V[0] + (STRIP_V[1]-STRIP_V[0])*((z-z0)/d))
                           : (STRIP_V[0] + (STRIP_V[1]-STRIP_V[0])*((x-x0)/w));
    const A=[x0, z1], B=[x1, z1], C2=[x1, z0], Dd=[x0, z0];
    qT(P(A[0],A[1]),P(B[0],B[1]),P(C2[0],C2[1]),P(Dd[0],Dd[1]),
       uAt(A[0],A[1]), uAt(B[0],B[1]), vAt(A[0],A[1]), vAt(Dd[0],Dd[1]));
  }

  for(const [c,r] of cells){
    const cx=c*w, cz=r*d;
    const X=[cx-w/2, cx+w/2], Y=[0,h], Z=[cz-d/2, cz+d/2];
    // 顶面已由上面的「连续墙段」统一铺好（整段一张，交界无亮边）。
    // 单格也要铺（孤立块没有段），这里补齐单格。
    if(cells.length===1){
      const idx=(has(c,r+1)?8:0)+(has(c,r-1)?4:0)+(has(c-1,r)?2:0)+(has(c+1,r)?1:0);
      const R = topCellRect(idx);
      const P=(x,z)=>[x,Y[1],z];
      const uAt = x => R.u0 + (R.u1-R.u0)*((x - (cx-w/2))/w);
      const vAt = z => R.v0 + (R.v1-R.v0)*((z - (cz-d/2))/d);
      qT(P(X[0],Z[1]),P(X[1],Z[1]),P(X[1],Z[0]),P(X[0],Z[0]),
         uAt(X[0]),uAt(X[1]),vAt(Z[1]),vAt(Z[0]));
    }

    // 侧面：LOCKED —— 四条立面，贴图/UV/段跨全固定。
    // 相邻格之间不生成（连通墙中间不该有墙）。
    const edges = [
      ['S', has(c,r-1)], ['N', has(c,r+1)],
      ['W', has(c-1,r)], ['E', has(c+1,r)],
    ];
    const open = {};
    edges.forEach(([k,occupied])=>{ if(!occupied) open[k]=1; });

    for(let s=0;s<segCount;s++){
      const ya=s*step, yb=(s+1)*step;
      // v 恒为 FACE_V 锁定区间（15 行），不随段高缩放
      const v0=FACE_V[0], v1=FACE_V[1];
      if(open.S) qS([X[1],ya,Z[0]],[X[0],ya,Z[0]],[X[0],yb,Z[0]],[X[1],yb,Z[0]], 0,FUSE_W,v0,v1);
      if(open.N) qS([X[0],ya,Z[1]],[X[1],ya,Z[1]],[X[1],yb,Z[1]],[X[0],yb,Z[1]], 0,FUSE_W,v0,v1);
      if(open.W) qS([X[0],ya,Z[0]],[X[0],ya,Z[1]],[X[0],yb,Z[1]],[X[0],yb,Z[0]], FUSE_W,0,v0,v1);
      if(open.E) qS([X[1],ya,Z[1]],[X[1],ya,Z[0]],[X[1],yb,Z[0]],[X[1],yb,Z[1]], FUSE_W,0,v0,v1);
    }
  }
  return {gT, gS};
}

// 顶面网格与侧面网格（都用图集 atlas.png）
function makeGeo(G){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(G.pos,3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(G.uvs,2));
  g.setIndex(G.idx); g.computeVertexNormals();
  return g;
}
const built = buildWall(D,H,D);
const meshTop  = new THREE.Mesh(makeGeo(built.gT), matTop);
const meshSide = new THREE.Mesh(makeGeo(built.gS), matSide);
scene.add(meshTop); scene.add(meshSide);

// 切换形态：顶面与立面**几何**都重建（格子集合变了，立面自然不同），
// 但立面**贴图与 UV 常量锁死**不变（FACE_V / FUSE_W / 段跨），所以
// 单看一面墙时全形态的立面完全相同。
window.__setForm = (name)=>{
  if(!FORMS[name]) return;
  FORM = name;

  const b = buildWall(D,H,D);
  meshTop.geometry.dispose();  meshTop.geometry = makeGeo(b.gT);
  meshSide.geometry.dispose(); meshSide.geometry = makeGeo(b.gS);
  setView(cur);          // 包围盒变了，相机跟着重新取景
  draw();
};

const grid = new THREE.GridHelper(12,24,0x4a5568,0x2e3446);
grid.position.y = -0.003; scene.add(grid);

// ---------------------------------------------------------------- 视图
// 相机按**当前格子集合的包围盒**自动取景，任何形态/变体都能看全。
// dir 是观察方向（单位向量），dist 由包围盒半径决定。
const VIEW_DIRS = {
  '45°':[ 0.62, 0.52,-0.62],   '俯视':[ 0.05, 1.00, 0.02],
  '主视·南':[0.00, 0.12,-1.00], '侧视·东':[1.00, 0.12, 0.00],
  '低角度':[ 0.66, 0.16,-0.66], '贴脸':[0.00, 0.10,-1.00],
};
// 包围盒中心与半径（XZ 平面 + 高度）
function sceneBounds(){
  const cs = FORMS[FORM].cells;
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const [c,r] of cs){
    x0=Math.min(x0,c); x1=Math.max(x1,c);
    z0=Math.min(z0,r); z1=Math.max(z1,r);
  }
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  // 含半格外扩
  const rad = Math.hypot((x1-x0+1)/2, (z1-z0+1)/2, H/2);
  return {cx, cz, rad};
}
function viewFor(k){
  const d = VIEW_DIRS[k] || VIEW_DIRS['45°'];
  const {cx,cz,rad} = sceneBounds();
  const ctr = [cx, H*0.45, cz];
  const dist = rad / Math.tan(fovRad/2) * 1.15;
  const n = Math.hypot(d[0],d[1],d[2]);
  return { p:[ctr[0]+d[0]/n*dist, ctr[1]+d[1]/n*dist, ctr[2]+d[2]/n*dist], t:ctr };
}
const VIEWS = {};   // 兼容旧引用；实际取景走 viewFor()
const fovRad = camera.fov * Math.PI / 180;
const hud = document.getElementById('hud');
const bar = document.getElementById('views');
let cur='45°';
function setView(k){
  cur=k; const v=viewFor(k);
  camera.position.set(...v.p); controls.target.set(...v.t); controls.update();
  [...bar.children].forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  draw();
}
Object.keys(VIEWS).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.k=k;
  b.onclick=()=>setView(k); bar.appendChild(b);
});
addEventListener('keydown',e=>{
  const ks=Object.keys(VIEWS), i=ks.indexOf(cur);
  if(e.key==='ArrowRight') setView(ks[(i+1)%ks.length]);
  if(e.key==='ArrowLeft')  setView(ks[(i-1+ks.length)%ks.length]);
  if(e.key==='g'||e.key==='G') grid.visible=!grid.visible;
});
function draw(){
  hud.innerHTML =
    `<b>${cur}</b><br>`+
    `图集 atlas.png 128x128 · 每格 32<br>`+
    `顶面 = 16 种连通性变体 (灰边=N/S/W/E 有墙)<br>`+
    `立面 = 行0 v = [${FACE_V[0].toFixed(4)}, ${FACE_V[1].toFixed(4)}] (21行砖条原样)<br>`+
    `侧面 u = [0, ${(80/128).toFixed(4)}] (80列原样)<br>`+
    `形态 <b>${FORM}</b>（侧视段全形态共用）<br>`+
    `侧视整段重复 <b>${segCount}</b> 次 · 段跨 ${segW.toFixed(4)}<br>`+
    `拖拽旋转 · 滚轮缩放 · ← → 切视角 · G 网格`;
}
const fbar = document.getElementById('forms');
Object.keys(FORMS).forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.dataset.f=k;
  b.onclick=()=>{ window.__setForm(k); [...fbar.children].forEach(x=>x.classList.toggle('on',x.dataset.f===k)); };
  fbar.appendChild(b);
});
const SP   = new URLSearchParams(location.search);
const q= SP.get('view');
const fq   = SP.get('form');
// ?cells=0,0;1,0  -> 任意格子集合（覆盖 16 变体，无需预定义形态）
const cq   = SP.get('cells');
if(cq){
  const cells = cq.split(';').filter(Boolean)
                .map(t=>t.split(',').map(Number));
  FORMS['__custom'] = {cells};
  window.__setForm('__custom');
  if(fbar) fbar.style.display='none';
  if(document.getElementById('hud')) document.getElementById('hud').style.display='none';
  if(document.getElementById('views')) document.getElementById('views').style.display='none';
}else if(fq && FORMS[fq]){
  window.__setForm(fq);
  [...fbar.children].forEach(x=>x.classList.toggle('on',x.dataset.f===fq));
}
// ?bare=1 -> 无UI 纯净渲染（批图用）
if(SP.get('bare')==='1'){
  for(const id of ['hud','views','forms'])
    if(document.getElementById(id)) document.getElementById(id).style.display='none';
}
setView(Object.keys(VIEW_DIRS).includes(q) ? q : '45°');
function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); }
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); draw();
});
window.__setView = setView;
</script>
</body>
</html>
