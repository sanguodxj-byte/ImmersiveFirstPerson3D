<script type="module">

// ---- 确定性伪随机与噪声（与 C# 端同构）----
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(ix, iy, seed = 1337) {
  let n = (Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(seed | 0, 1442695041)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function cLerp(c1, c2, t) {
  const k = clamp01(t);
  return [c1[0] + (c2[0] - c1[0]) * k, c1[1] + (c2[1] - c1[1]) * k, c1[2] + (c2[2] - c1[2]) * k];
}
function cMul(c1, c2) { return [c1[0] * c2[0], c1[1] * c2[1], c1[2] * c2[2]]; }
function cScale(c, s) { return [c[0] * s, c[1] * s, c[2] * s]; }

// 非周期值噪声（旧版 Fbm 等价）
function valueNoise(x, y, seed = 17) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}

function fbmNonPeriodic(x, y) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) {
    v += valueNoise(x * f + 13.7, y * f + 7.1, 17 + i * 31) * amp;
    f *= 2.03; amp *= 0.5;
  }
  return v;
}

// 周期无缝噪声（新版云层：零四角平均方差衰减、零接缝）
function periodicNoise(u, v, period, seed) {
  const x = ((u % 1) + 1) % 1 * period;
  const y = ((v % 1) + 1) % 1 * period;
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % period) + period) % period;
  const x1 = (x0 + 1) % period;
  const y0 = ((iy % period) + period) % period;
  const y1 = (y0 + 1) % period;
  const a = hash2(x0, y0, seed), b = hash2(x1, y0, seed);
  const c = hash2(x0, y1, seed), d = hash2(x1, y1, seed);
  return (a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy;
}

function periodicFbm(u, v, basePeriod = 4, octaves = 4, seed = 101) {
  let val = 0, amp = 0.56, norm = 0, p = basePeriod;
  for (let i = 0; i < octaves; i++) {
    val += periodicNoise(u, v, p, seed + i * 53) * amp;
    norm += amp;
    p *= 2;
    amp *= 0.45;
  }
  const raw = val / norm;
  return clamp01((raw - 0.5) * 2.45 + 0.5);
}

// 周期蜂窝云团核（模拟一团团圆润饱满的积云花椰菜隆起）
function periodicPuffs(u, v, period = 4, seed = 707) {
  const x = (((u % 1) + 1) % 1) * period;
  const y = (((v % 1) + 1) % 1) * period;
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  let minD2 = 9.0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const cx = ((ix + dx) % period + period) % period;
      const cy = ((iy + dy) % period + period) % period;
      const ox = dx + 0.18 + 0.64 * hash2(cx, cy, seed);
      const oy = dy + 0.18 + 0.64 * hash2(cx, cy, seed + 97);
      const d2 = (fx - ox) * (fx - ox) + (fy - oy) * (fy - oy);
      if (d2 < minD2) minD2 = d2;
    }
  }
  return clamp01(1.0 - Math.sqrt(minD2) * 1.18);
}

// ============================================================
// 预设环境参数（对应原版 RimWorld 各时段与天气采样）
// ============================================================
const PRESETS = {

  },

    rain: 0, snow: 0, sand: 0, fog: 0, storm: 0, flash: 0, aurora: 0.92,

    wind: 1.65, windAngle: 0.9, defaultYaw: 230
  },
  snow: {

    dayPct: 0.44, celGlow: 0.82, glow: 0.68, shine: 0.35,
    skyMul: [0.86, 0.90, 0.96], shadowCol: [0.26, 0.30, 0.36],
    rain: 0.2, snow: 0.95, sand: 0, fog: 0.24, storm: 0, flash: 0, aurora: 0,
    wind: 0.85, windAngle: 1.2, defaultYaw: 135
  },
  fog_sand: {
    label: '沙尘浓雾 (15:30 扬沙)',
    dayPct: 0.64, celGlow: 0.78, glow: 0.58, shine: 0.35,
    skyMul: [0.94, 0.78, 0.56], shadowCol: [0.28, 0.22, 0.14],

};

function sampleEnv(pKey, mode) {
  const p = PRESETS[pKey] || PRESETS.noon;
  const e = { ...p };
  const wet = e.snow > 0.2 ? Math.max(e.snow, e.rain * 0.35) : e.rain;
  const isRefined = mode === 'v2' || mode === 'v3' || mode === 'v4' || mode === 'v5' || mode === 'v6';
  // 晴朗星夜保持低云量 (0.06)，让银河、繁星与满月完整展现；扬沙天由沙暴风幔主导
  const baseCloud = (isRefined && e.glow < 0.2 && wet < 0.1) ? 0.06
                  : (isRefined && e.sand > 0.5) ? 0.05
                  : 0.18;
  e.cloudiness = clamp01(baseCloud + wet * 0.65 + (e.sand > 0.5 ? 0 : e.fog * 0.55) + e.storm * 0.28);

  if (mode === 'old') {
    const angle = (e.dayPct - 0.5) * Math.PI * 2;
    const sx = -Math.sin(angle), sz = -Math.cos(angle), sy = 0.06;
    const len = Math.hypot(sx, sy, sz);
    e.sunDir = new THREE.Vector3(sx / len, sy / len, sz / len);
    e.moonDir = new THREE.Vector3(-e.sunDir.x, Math.max(0.08, -e.sunDir.y), -e.sunDir.z).normalize();

    const g = clamp01(e.glow);
    const dayZenith = [0.30, 0.50, 0.86], nightZenith = [0.015, 0.02, 0.06];
    const dayHorizon = [0.62, 0.78, 0.94], nightHorizon = [0.05, 0.07, 0.12];
    e.sky = cMul(cLerp(nightZenith, dayZenith, g), e.skyMul);
    e.horizon = cLerp(nightHorizon, dayHorizon, clamp01(g * 1.25));
    const sunLow = 1.0 - clamp01(e.sunDir.y * 2.4);
    e.horizon = cLerp(e.horizon, cMul([0.98, 0.55, 0.28], e.skyMul), sunLow * 0.72 * g);
    const overcast = cScale([0.50, 0.54, 0.60], lerp(0.28, 1.0, g));
    e.sky = cLerp(e.sky, overcast, e.cloudiness * 0.72);
    e.horizon = cLerp(e.horizon, overcast, e.cloudiness * 0.55 + e.fog * 0.35);
    if (e.fog > 0.05) {
      const haze = cScale([0.74, 0.77, 0.80], lerp(0.35, 1.0, g));
      e.sky = cLerp(e.sky, haze, e.fog * 0.65);
      e.horizon = cLerp(e.horizon, haze, e.fog * 0.8);
    }
    if (e.sand > 0.05) {
      const dust = cScale([0.72, 0.55, 0.32], lerp(0.4, 1.0, g));
      e.sky = cLerp(e.sky, dust, e.sand * 0.45);
      e.horizon = cLerp(e.horizon, dust, e.sand * 0.65);
    }
    e.ground = cScale(cLerp([0.04, 0.05, 0.05], e.shadowCol, 0.35), lerp(0.4, 1.0, g));
    if (e.flash > 0.02) {
      const bolt = [0.85, 0.90, 1.0];
      e.sky = cLerp(e.sky, bolt, e.flash);
      e.horizon = cLerp(e.horizon, bolt, e.flash * 0.65);
    }
    return e;
  }

  const ha = (e.dayPct - 0.5) * Math.PI * 2;
  const rawElev = Math.cos(ha);
  const maxAlt = isRefined ? 0.55 : 0.82;
  const sy = rawElev >= 0
    ? lerp(rawElev * maxAlt, lerp(-0.02, maxAlt, e.celGlow), 0.32)
    : rawElev * 0.55;
  const sx = -Math.sin(ha);
  const sz = (isRefined ? -0.80 : -0.34) * (0.35 + 0.65 * Math.max(0, rawElev));
  e.sunDir = new THREE.Vector3(sx, sy, sz).normalize();

  const mElev = Math.max(0.28, -rawElev * (isRefined ? 0.46 : 0.74));
  e.moonDir = new THREE.Vector3(Math.sin(ha) * 0.45 + 0.14, mElev, -0.85).normalize();

  const g = clamp01(e.glow);
  const dayZenith = isRefined ? [0.09, 0.30, 0.76] : [0.16, 0.40, 0.84];
  const nightZenith = [0.012, 0.024, 0.072];
  const dayMid = isRefined ? [0.24, 0.52, 0.90] : [0.32, 0.58, 0.92];
  const nightMid = [0.028, 0.052, 0.128];
  const dayHorizon = isRefined ? [0.68, 0.84, 0.97] : [0.68, 0.83, 0.96];
  const nightHorizon = [0.062, 0.100, 0.185];

  e.sky = cMul(cLerp(nightZenith, dayZenith, Math.pow(g, 0.85)), e.skyMul);
  e.midSky = cMul(cLerp(nightMid, dayMid, Math.pow(g, 0.8)), e.skyMul);
  e.horizon = cLerp(nightHorizon, dayHorizon, clamp01(Math.pow(g, 0.7) * 1.15));

  const sunElev = e.sunDir.y;
  const twilight = clamp01(1.0 - Math.abs(sunElev - 0.12) / 0.28) * clamp01((g - 0.06) / 0.35) * (1.0 - e.cloudiness * 0.55);
  e.twilight = twilight;
  e.sunGlowHorizon = [1.00, 0.44, 0.14];
  e.sunGlowUpper = [0.95, 0.38, 0.50];
  e.antiSunHorizon = [0.54, 0.42, 0.66];

  if (twilight > 0.01) {
    e.horizon = cLerp(e.horizon, [0.96, 0.58, 0.34], twilight * 0.58);
    e.midSky = cLerp(e.midSky, [0.44, 0.38, 0.72], twilight * 0.42);
  }

  const overcastZen = cScale([0.30, 0.36, 0.45], lerp(0.22, 0.86, g));
  const overcastHor = cScale([0.50, 0.56, 0.64], lerp(0.26, 0.90, g));
  const cov = clamp01((e.cloudiness - 0.22) / 0.78);
  e.sky = cLerp(e.sky, overcastZen, cov * 0.78);
  e.midSky = cLerp(e.midSky, cLerp(overcastZen, overcastHor, 0.5), cov * 0.72);
  e.horizon = cLerp(e.horizon, overcastHor, cov * 0.68);

  if (e.storm > 0.1) {
    const stormDark = isRefined ? [0.08, 0.11, 0.19] : cScale([0.20, 0.24, 0.32], lerp(0.35, 0.85, g));
    const stormHor = isRefined ? [0.16, 0.21, 0.32] : stormDark;
    e.sky = cLerp(e.sky, stormDark, e.storm * 0.88);
    e.midSky = cLerp(e.midSky, stormDark, e.storm * 0.82);
    e.horizon = cLerp(e.horizon, stormHor, e.storm * 0.75);
  }
  if (e.snow > 0.1) {
    const snowSky = cScale([0.62, 0.70, 0.80], lerp(0.38, 0.92, g));
    const snowHor = cScale([0.78, 0.84, 0.91], lerp(0.42, 0.95, g));
    e.sky = cLerp(e.sky, snowSky, e.snow * 0.58);
    e.midSky = cLerp(e.midSky, snowHor, e.snow * 0.55);
    e.horizon = cLerp(e.horizon, snowHor, e.snow * 0.72);
  }
  if (e.fog > 0.05 && e.sand < 0.2 && e.storm < 0.3) {
    const haze = cScale([0.74, 0.79, 0.84], lerp(0.35, 1.0, g));
    e.sky = cLerp(e.sky, haze, e.fog * 0.55);
    e.midSky = cLerp(e.midSky, haze, e.fog * 0.68);
    e.horizon = cLerp(e.horizon, haze, e.fog * 0.82);
  }
  if (e.sand > 0.05) {
    const dustTop = cScale([0.62, 0.44, 0.24], lerp(0.42, 0.95, g));
    const dustMid = cScale([0.78, 0.58, 0.32], lerp(0.45, 0.98, g));
    const dustHor = cScale([0.88, 0.69, 0.42], lerp(0.45, 1.0, g));
    e.sky = cLerp(e.sky, dustTop, e.sand * 0.78);
    e.midSky = cLerp(e.midSky, dustMid, e.sand * 0.85);
    e.horizon = cLerp(e.horizon, dustHor, e.sand * 0.92);
  }
  if (e.flash > 0.02 && mode === 'v1') {
    const bolt = [0.82, 0.90, 1.0];
    e.sky = cLerp(e.sky, bolt, e.flash * 0.65);
    e.midSky = cLerp(e.midSky, bolt, e.flash * 0.75);
    e.horizon = cLerp(e.horizon, bolt, e.flash * 0.55);
  }
  e.ground = cScale(cLerp([0.08, 0.10, 0.09], e.shadowCol, 0.45), lerp(0.35, 1.0, g));
  return e;
}

// ============================================================
// 纹理生成器（与 SkyScenery.cs 完全同算法）
// ============================================================
function makeDomeTexture(env, mode) {
  const w = mode === 'old' ? 96 : 128;
  const h = mode === 'old' ? 64 : 96;
  const data = new Uint8Array(w * h * 4);
  const sun = env.sunDir.clone().normalize();
  const moon = (env.moonDir || new THREE.Vector3(0, 1, 0)).clone().normalize();

  if (mode === 'old') {
    const warm = cLerp([1.0, 0.96, 0.88], [1.0, 0.48, 0.18], 1.0 - clamp01(sun.y * 2.2));
    const shine = Math.max(env.shine, env.glow * 0.85);
    for (let y = 0; y < h; y++) {
      const v = y / (h - 1);
      const phi = v * Math.PI;
      const above = 0.5 - v;
      let band;
      if (above >= 0) {
        const k = clamp01(above / 0.5);
        band = cLerp(env.horizon, env.sky, Math.pow(k, 0.62));
        const haze = Math.exp(-Math.pow((k - 0.08) / 0.10, 2));
        band = cLerp(band, cScale(env.horizon, 1.08), haze * (0.28 + env.fog * 0.45));
      } else {
        band = cLerp(env.horizon, env.ground, clamp01(-above / 0.18));
      }
      const sp = Math.sin(phi), cp = Math.cos(phi);
      for (let x = 0; x < w; x++) {
        const theta = (x / (w - 1)) * Math.PI * 2;
        const dx = sp * Math.cos(theta), dy = cp, dz = sp * Math.sin(theta);
        const nd = clamp01(dx * sun.x + dy * sun.y + dz * sun.z);
        const broad = Math.pow(nd, 5) * shine * clamp01(env.glow + 0.15);
        const disc = Math.pow(nd, 64) * shine;
        const col = cLerp(band, warm, clamp01(broad * 0.62 + disc));
        const idx = ((h - 1 - y) * w + x) * 4;
        data[idx] = clamp01(col[0]) * 255;
        data[idx + 1] = clamp01(col[1]) * 255;
        data[idx + 2] = clamp01(col[2]) * 255;
        data[idx + 3] = 255;
      }
    }
  } else {
    // 新版：三段瑞利散射 + 方位角朝霞/晚霞/维纳斯带 + 各向异性米氏散射 + 夜间银河星云带 + 极光幕
    const sunH = new THREE.Vector2(sun.x, sun.z);
    if (sunH.lengthSq() > 0.0001) sunH.normalize();
    const clearFactor = (1.0 - env.cloudiness * 0.78) * (1.0 - env.fog * 0.85) * (1.0 - env.sand * 0.85);
    const nightVis = clamp01((0.32 - env.glow) / 0.28) * clearFactor;
    const galNorm = new THREE.Vector3(0.44, 0.56, -0.70).normalize();
    const galRight = new THREE.Vector3(0.78, -0.15, 0.60).normalize();
    const galUp = new THREE.Vector3().crossVectors(galNorm, galRight).normalize();

    const sunWarm = cLerp([1.0, 0.97, 0.90], [1.0, 0.50, 0.18], clamp01(1.0 - sun.y * 1.8));
    const sunVis = clamp01((sun.y + 0.10) / 0.22) * clearFactor;

    for (let y = 0; y < h; y++) {
      const v = y / (h - 1); // 0 天顶 .. 1 天底
      const phi = v * Math.PI;
      const sp = Math.sin(phi), cp = Math.cos(phi);
      const above = 0.5 - v;
      for (let x = 0; x < w; x++) {
        const theta = (x / (w - 1)) * Math.PI * 2;
        const dx = sp * Math.cos(theta), dy = cp, dz = sp * Math.sin(theta);
        let col;
        if (above >= 0) {
          const k = clamp01(above / 0.5); // 0 地平线 .. 1 天顶
          if (k < 0.42) {
            col = cLerp(env.horizon, env.midSky, Math.pow(k / 0.42, 0.72));
          } else {
            col = cLerp(env.midSky, env.sky, Math.pow((k - 0.42) / 0.58, 0.78));
          }

          // 地平线大气辉光带
          const horGlow = Math.exp(-Math.pow(k / 0.14, 2));
          col = cLerp(col, cScale(env.horizon, 1.07), horGlow * (0.32 + env.fog * 0.4));

          // 晨昏方位角散射（朝霞/晚霞 + 反日端维纳斯带）
          if (env.twilight > 0.01) {
            const az = (dx * sunH.x + dz * sunH.y) / Math.max(0.05, sp);
            const sunSide = Math.pow(clamp01(az * 0.5 + 0.5), 1.6);
            const antiSide = Math.pow(clamp01(-az * 0.5 + 0.5), 1.5);
            const lowBand = Math.exp(-Math.pow(k / 0.26, 1.6));
            const midBand = Math.exp(-Math.pow((k - 0.22) / 0.22, 2.0));
            col = cLerp(col, env.sunGlowHorizon, env.twilight * sunSide * lowBand * 0.85);
            col = cLerp(col, env.sunGlowUpper, env.twilight * sunSide * midBand * 0.52);
            col = cLerp(col, env.antiSunHorizon, env.twilight * antiSide * midBand * 0.45);
          }

          // 太阳米氏前向散射光晕
          if (sunVis > 0.01) {
            const nd = clamp01(dx * sun.x + dy * sun.y + dz * sun.z);
            const mieBroad = Math.pow(nd, 4.5) * 0.48 * sunVis;
            const mieCore = Math.pow(nd, 28.0) * 0.65 * sunVis;
            col = cLerp(col, sunWarm, clamp01(mieBroad + mieCore));
          }

          // 夜间月华光晕 + 银河星云带 + 极光幕
          if (nightVis > 0.01) {
            const md = clamp01(dx * moon.x + dy * moon.y + dz * moon.z);
            const moonGlow = Math.pow(md, 6.0) * 0.30 * nightVis;
            col = cLerp(col, [0.42, 0.54, 0.78], moonGlow);

            // 银河带：沿倾斜大圆的高斯带 + 连续噪声云团与暗尘埃带
            const galLat = dx * galNorm.x + dy * galNorm.y + dz * galNorm.z;
            const galLon = Math.atan2(dx * galUp.x + dy * galUp.y + dz * galUp.z,
                                      dx * galRight.x + dy * galRight.y + dz * galRight.z);
            const galProfile = Math.exp(-Math.pow(galLat / 0.22, 2)) * clamp01((k - 0.08) / 0.25);
            if (galProfile > 0.02) {
              const uGal = (galLon / (Math.PI * 2) + 0.5);
              const vGal = galLat * 1.8 + 0.5;
              const n1 = periodicFbm(uGal, vGal, 4, 4, 307);
              const dustRift = smoothstep(0.46, 0.62, periodicFbm(uGal * 2, vGal * 2, 4, 3, 509)) * Math.exp(-Math.pow(galLat / 0.06, 2));
              const mwIntensity = galProfile * clamp01((n1 - 0.32) * 1.9) * (1.0 - dustRift * 0.68) * nightVis;
              const mwCol = cLerp([0.14, 0.22, 0.42], [0.38, 0.32, 0.52], n1);
              col = [col[0] + mwCol[0] * mwIntensity * 0.85,
                     col[1] + mwCol[1] * mwIntensity * 0.85,
                     col[2] + mwCol[2] * mwIntensity * 0.95];
            }

            // 极光幕（Aurora）
            if (env.aurora > 0.05 && k > 0.12 && k < 0.82) {
              const wave = Math.sin(theta * 3.0 + 0.8) * 0.08 + Math.cos(theta * 5.0 - 0.4) * 0.04;
              const curtain = Math.exp(-Math.pow((k - 0.38 - wave) / 0.16, 2));
              const rays = 0.55 + 0.45 * Math.sin(theta * 14.0 + periodicFbm(theta / (Math.PI * 2), k, 4, 3, 809) * 6.0);
              const aurAmt = env.aurora * curtain * rays * nightVis;
              const aurCol = cLerp([0.10, 0.92, 0.52], [0.58, 0.22, 0.90], clamp01((k - 0.28) / 0.32));
              col = [col[0] + aurCol[0] * aurAmt * 0.62,
                     col[1] + aurCol[1] * aurAmt * 0.68,
                     col[2] + aurCol[2] * aurAmt * 0.62];
            }
          }
        } else {
          const kd = clamp01(-above / 0.16);
          col = cLerp(env.horizon, env.ground, Math.pow(kd, 0.75));
        }
        const idx = ((h - 1 - y) * w + x) * 4;
        data[idx] = Math.min(255, Math.max(0, Math.round(col[0] * 255)));
        data[idx + 1] = Math.min(255, Math.max(0, Math.round(col[1] * 255)));
        data[idx + 2] = Math.min(255, Math.max(0, Math.round(col[2] * 255)));
        data[idx + 3] = 255;
      }
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

function makeRadialTex(n, inner, gamma) {
  const data = new Uint8Array(n * n * 4);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const dx = (x + 0.5) / n - 0.5, dy = (y + 0.5) / n - 0.5;
      const r = Math.hypot(dx, dy) * 2;
      let a = r <= inner ? 1 : clamp01(1 - (r - inner) / Math.max(0.001, 1 - inner));
      a = Math.pow(a, gamma);
      const idx = (y * n + x) * 4;
      data[idx] = 255; data[idx + 1] = 255; data[idx + 2] = 255;
      data[idx + 3] = Math.round(a * 255);
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// 太阳圆盘贴图：炽白高光核 + 暖金临边昏暗，确保在朝霞/晚霞背景上清晰跃出
function makeSunDiscTex(n, lowFactor = 0.0) {
  const data = new Uint8Array(n * n * 4);
  const edgeCol = cLerp([1.0, 0.92, 0.72], [1.0, 0.58, 0.18], lowFactor);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const dx = (x + 0.5) / n - 0.5, dy = (y + 0.5) / n - 0.5;
      const r = Math.hypot(dx, dy) * 2;
      const idx = (y * n + x) * 4;
      if (r >= 1.0) continue;
      let a = r <= 0.54 ? 1.0 : Math.pow(clamp01(1.0 - (r - 0.54) / 0.46), 1.45);
      const coreMix = clamp01(1.0 - r / 0.72);
      const cr = lerp(edgeCol[0], 1.0, coreMix);
      const cg = lerp(edgeCol[1], 1.0, Math.pow(coreMix, 0.72));
      const cb = lerp(edgeCol[2], 0.96, Math.pow(coreMix, 0.52));
      data[idx] = Math.round(cr * 255);
      data[idx + 1] = Math.round(cg * 255);
      data[idx + 2] = Math.round(cb * 255);
      data[idx + 3] = Math.round(a * 255);
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// 太阳日冕光芒贴图（实心柔和径向光晕 + 微弱光芒束，零空心）
function makeCoronaTex(n) {
  const data = new Uint8Array(n * n * 4);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const dx = (x + 0.5) / n - 0.5, dy = (y + 0.5) / n - 0.5;
      const r = Math.hypot(dx, dy) * 2;
      if (r >= 1) continue;
      const ang = Math.atan2(dy, dx);
      const base = Math.pow(1 - r, 2.0);
      const ray1 = Math.pow(0.5 + 0.5 * Math.cos(ang * 8), 3.0);
      const ray2 = Math.pow(0.5 + 0.5 * Math.cos(ang * 14 + 0.9), 4.0);
      const rays = (ray1 * 0.25 + ray2 * 0.16) * Math.pow(1 - r, 1.4) * smoothstep(0.05, 0.25, r);
      const a = clamp01(base * 0.85 + rays);
      const idx = (y * n + x) * 4;
      data[idx] = 255; data[idx + 1] = 248; data[idx + 2] = 230;
      data[idx + 3] = Math.round(a * 255);
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// 月球圆盘贴图（实心银白盘面 + 高对比月海与高地环形山明暗细节）
function makeMoonTex(n) {
  const data = new Uint8Array(n * n * 4);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const dx = ((x + 0.5) / n - 0.5) * 2.2;
      const dy = ((y + 0.5) / n - 0.5) * 2.2;
      const r2 = dx * dx + dy * dy;
      const r = Math.sqrt(r2);
      const idx = (y * n + x) * 4;
      if (r <= 1.0) {
        const nz = Math.sqrt(Math.max(0, 1.0 - r2));
        const maria = periodicFbm(dx * 0.45 + 0.32, dy * 0.45 + 0.58, 3, 4, 701);
        const craters = periodicPuffs(dx * 0.55 + 0.5, dy * 0.55 + 0.5, 4, 911);
        const seaMask = smoothstep(0.42, 0.62, maria);
        const shade = lerp(0.98, 0.42, seaMask) * (0.86 + 0.16 * craters);
        const limb = 0.76 + 0.24 * Math.pow(nz, 0.45);
        const lum = clamp01(shade * limb);
        const edgeA = smoothstep(1.0, 0.93, r);
        data[idx] = Math.round(lum * 236);
        data[idx + 1] = Math.round(lum * 244);
        data[idx + 2] = Math.round(Math.min(1, lum * 1.06) * 255);
        data[idx + 3] = Math.round(edgeA * 255);
      } else if (r < 1.15) {
        const halo = Math.pow(1 - (r - 1.0) / 0.15, 2.0) * 0.42;
        data[idx] = 210; data[idx + 1] = 228; data[idx + 2] = 255;
        data[idx + 3] = Math.round(halo * 255);
      }
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// 4x4 星图图集
function makeStarAtlasTex(n = 128) {
  const data = new Uint8Array(n * n * 4);
  const cell = n / 4;
  const tints = [
    [0.72, 0.86, 1.00],
    [0.98, 0.99, 1.00],
    [1.00, 0.91, 0.72],
    [1.00, 0.76, 0.54]
  ];
  const mags = [1.0, 0.82, 0.58, 0.38];
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 4; col++) {
      const tint = tints[col];
      const mag = mags[row];
      for (let py = 0; py < cell; py++) {
        for (let px = 0; px < cell; px++) {
          const dx = (px + 0.5) / cell - 0.5;
          const dy = (py + 0.5) / cell - 0.5;
          const r = Math.hypot(dx, dy) * 2;
          let a = Math.pow(clamp01(1 - r), row === 0 ? 1.6 : 2.1);
          if (row <= 1) {
            const cross = (Math.exp(-Math.abs(dx) * 16) * Math.exp(-Math.abs(dy) * 3.0)
                         + Math.exp(-Math.abs(dy) * 16) * Math.exp(-Math.abs(dx) * 3.0)) * (row === 0 ? 0.48 : 0.25);
            a = clamp01(a + cross * clamp01(1 - r));
          }
          a *= mag;
          const core = Math.pow(clamp01(1 - r * 1.6), 1.8);
          const cr = clamp01(lerp(tint[0], 1.0, core * 0.70));
          const cg = clamp01(lerp(tint[1], 1.0, core * 0.70));
          const cb = clamp01(lerp(tint[2], 1.0, core * 0.70));
          const x = col * cell + px, y = row * cell + py;
          const idx = (y * n + x) * 4;
          data[idx] = Math.round(cr * 255);
          data[idx + 1] = Math.round(cg * 255);
          data[idx + 2] = Math.round(cb * 255);
          data[idx + 3] = Math.round(a * 255);
        }
      }
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

function makeCloudTexOld(n = 256) {
  const h = n / 2;
  const data = new Uint8Array(n * h * 4);
  const S = 5.0;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    const along = y / (h - 1);
    const rim = smoothstep(0, 0.38, along);
    for (let x = 0; x < n; x++) {
      const u = x / n;
      const a = fbmNonPeriodic(u * S, v * S);
      const b = fbmNonPeriodic((u - 1) * S, v * S);
      const c = fbmNonPeriodic(u * S, (v - 1) * S);
      const d = fbmNonPeriodic((u - 1) * S, (v - 1) * S);
      const val = a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
      let alpha = clamp01((val - 0.46) / 0.24);
      alpha = alpha * alpha * (3 - 2 * alpha) * rim;
      const g = Math.round(255 * lerp(0.78, 1.0, alpha));
      const idx = (y * n + x) * 4;
      data[idx] = g; data[idx + 1] = g; data[idx + 2] = 255;
      data[idx + 3] = Math.round(alpha * 220);
    }
  }
  const t = new THREE.DataTexture(data, n, h, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// ============================================================
// v6 真 3D 世界空间体积云簇、真 3D 交叉等离子闪电、真 3D 空间雨雪粒子场
// ============================================================

// 1. 真 3D 体积切片云场（12 层高度切片 hFrac = 0.0..1.0，在世界空间 Y = 33m..40.5m 配合曲率下垂形成浑然一体的三维体积积云）
function makeVolumetricCloudSliceTex(n = 512, seed = 101, cloudiness = 0.22, hFrac = 0.5, sunDir = new THREE.Vector3(0, 0.6, -0.8), env = null) {
  const data = new Uint8Array(n * n * 4);
  const ov = clamp01((cloudiness - 0.35) / 0.65);
  // 随高度 hFrac (0 云底 -> 1 云顶) 平滑收缩横向截面：底层宽平、高层隆起成圆润积云塔冠
  const heightErode = hFrac < 0.25
    ? (0.25 - hFrac) * 0.18
    : Math.pow((hFrac - 0.25) / 0.75, 1.35) * lerp(0.18, 0.11, ov);
  const baseThresh = lerp(0.61, 0.20, clamp01(cloudiness)) + heightErode;
  const span = lerp(0.20, 0.28, clamp01(cloudiness));

  const rawField = (u, v) => {
    const macro = periodicFbm(u, v, 3, 4, seed);
    const puffs = periodicPuffs(u * 1.25, v * 1.25, 4, seed + 131);
    const billow = periodicFbm(u * 2.0 + 0.17, v * 2.0 + 0.31, 6, 3, seed + 211);
    const detail = periodicFbm(u * 4.0 + 0.41, v * 4.0 + 0.19, 12, 2, seed + 353);
    return macro * 0.48 + puffs * 0.28 + billow * 0.15 + detail * 0.09;
  };

  const sunN = sunDir.clone().normalize();
  const sLen = Math.hypot(sunN.x, sunN.z);
  const lx = sLen > 0.01 ? (sunN.x / sLen) * 0.022 : 0.016;
  const lz = sLen > 0.01 ? (sunN.z / sLen) * 0.022 : -0.016;

  // 三维体积色彩：晴天云底为清透银蓝、云冠纯白；阴雨雷暴云底压暗为深邃铅灰蓝
  const g = env ? clamp01(env.glow) : 1.0;
  const clearBot = cLerp([0.66, 0.75, 0.88], [0.44, 0.52, 0.66], ov);
  let topCol = cLerp([0.45, 0.54, 0.70], [1.00, 1.00, 1.00], Math.pow(g, 0.7));
  let botCol = cLerp([0.12, 0.16, 0.26], clearBot, Math.pow(g, 0.8));
  if (env && env.twilight > 0.05) {
    topCol = cLerp(topCol, [1.00, 0.84, 0.64], env.twilight * 0.78);
    botCol = cLerp(botCol, [0.58, 0.42, 0.60], env.twilight * 0.68);
  }
  if (env && env.storm > 0.2) {
    topCol = cLerp(topCol, [0.36, 0.42, 0.54], env.storm * 0.82);
    botCol = cLerp(botCol, [0.11, 0.14, 0.23], env.storm * 0.88);
  }
  if (env && env.snow > 0.2) {
    topCol = cLerp(topCol, [0.95, 0.97, 1.00], 0.55);
    botCol = cLerp(botCol, [0.58, 0.65, 0.75], 0.55);
  }

  for (let y = 0; y < n; y++) {
    const dz = ((y + 0.5) / n - 0.5) * 2.0;
    for (let x = 0; x < n; x++) {
      const dx = ((x + 0.5) / n - 0.5) * 2.0;
      const r = Math.hypot(dx, dz);
      if (r >= 1.0) continue;
      // 远距地平线边缘平滑消光
      const radialFade = smoothstep(0.96, 0.42, r);
      if (radialFade <= 0.001) continue;

      // 晴天在太阳方位留出透光天窗，让烈日与日冕穿过 3D 云层间隙
      let sunClear = 1.0;
      if (cloudiness < 0.35) {
        const wDir = new THREE.Vector3(dx * 135.0, 36.0 - r * r * 24.0, dz * 135.0).normalize();
        sunClear = smoothstep(0.985, 0.90, wDir.dot(sunN));
      }

      const u = dx * 0.75 + 10.0, v = dz * 0.75 + 10.0;
      const h0 = rawField(u, v);
      const d = clamp01((h0 - baseThresh) / span) * sunClear;
      if (d <= 0.002) continue;

      const hSun = rawField(u + lx, v + lz);
      const sunSlope = clamp01((h0 - hSun) * 6.5 + 0.55);
      const light = clamp01(hFrac * 0.56 + sunSlope * 0.44 - (1.0 - hFrac) * d * 0.24);
      const c = cLerp(botCol, topCol, light);

      const density = d * d * (3 - 2 * d) * radialFade;
      const layerAlpha = clamp01(Math.pow(density, 0.65) * lerp(0.46, 0.32, hFrac));
      const idx = (y * n + x) * 4;
      data[idx] = Math.round(clamp01(c[0]) * 255);
      data[idx + 1] = Math.round(clamp01(c[1]) * 255);
      data[idx + 2] = Math.round(clamp01(c[2]) * 255);
      data[idx + 3] = Math.round(layerAlpha * 255);
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

// 构造世界空间微拱三维云层水平切片网格（覆盖半径 135m，中心海拔 y = sliceY，向边缘微垂自然贴合大气曲率）
function build3DCloudSlabSliceMesh(radius = 135.0, sliceY = 36.0, curveDrop = 14.0) {
  const seg = 48, rings = 20;
  const pos = [], uvs = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const rf = r / rings;
    const dist = rf * radius;
    const y = sliceY - rf * rf * curveDrop;
    for (let s = 0; s <= seg; s++) {
      const a = (s / seg) * Math.PI * 2.0;
      const cs = Math.cos(a), sn = Math.sin(a);
      pos.push(cs * dist, y, sn * dist);
      uvs.push(0.5 + cs * rf * 0.49, 0.5 + sn * rf * 0.49);
    }
  }
  const stride = seg + 1;
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < seg; s++) {
      const a = r * stride + s, b = a + stride;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 2. 真 3D 等离子体闪电横向高斯发光贴图（中心炽白核 -> 内圈电光青 -> 外圈紫蓝平滑衰减至 0，彻底消除硬蓝边）
function makeLightningPlasmaTex(w = 64, h = 64) {
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const d = Math.abs((x + 0.5) / w - 0.5) * 2.0; // 0 轴心 .. 1 边缘
      const core = Math.exp(-d * d * 36.0);
      const inner = Math.exp(-d * d * 7.5);
      const outer = Math.exp(-d * d * 2.6) * smoothstep(1.0, 0.15, d);
      const a = clamp01(core + inner * 0.72 + outer * 0.38);
      const r = clamp01(core * 1.0 + inner * 0.55 + outer * 0.32);
      const g = clamp01(core * 1.0 + inner * 0.85 + outer * 0.58);
      const b = clamp01(core * 1.0 + inner * 1.00 + outer * 1.00);
      const idx = (y * w + x) * 4;
      data[idx] = Math.round(r * 255);
      data[idx + 1] = Math.round(g * 255);
      data[idx + 2] = Math.round(b * 255);
      data[idx + 3] = Math.round(a * 255);
    }
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

// 构造世界空间真 3D 轴向圆柱等离子体分形闪电（三维中点位移分形 + 径向视线正交束截面，零侧立面 1px 阶梯锯齿）
function build3DWorldLightningBolt(topPos, botPos, seed = 404, trunkRadius = 1.65) {
  const rnd = mulberry32(seed);
  const pos = [], uvs = [], idx = [];

  function addAxialSegment(p0, p1, r0, r1) {
    const tangent = new THREE.Vector3().subVectors(p1, p0);
    if (tangent.lengthSq() < 0.0001) return;
    tangent.normalize();
    const viewVec = new THREE.Vector3(p0.x, p0.y - 1.62, p0.z);
    let side = new THREE.Vector3().crossVectors(tangent, viewVec);
    if (side.lengthSq() < 0.001) side.set(1, 0, 0);
    side.normalize();

    const b = pos.length / 3;
    pos.push(
      p0.x - side.x * r0, p0.y - side.y * r0, p0.z - side.z * r0,
      p0.x + side.x * r0, p0.y + side.y * r0, p0.z + side.z * r0,
      p1.x + side.x * r1, p1.y + side.y * r1, p1.z + side.z * r1,
      p1.x - side.x * r1, p1.y - side.y * r1, p1.z - side.z * r1
    );
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }

  function subdividePath(a, b, gens, swayScale) {
    let pts = [a.clone(), b.clone()];
    let disp = swayScale;
    for (let g = 0; g < gens; g++) {
      const next = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const mid = new THREE.Vector3().addVectors(pts[i], pts[i + 1]).multiplyScalar(0.5);
        mid.x += (rnd() - 0.5) * disp;
        mid.y += (rnd() - 0.5) * disp * 0.22;
        mid.z += (rnd() - 0.5) * disp;
        next.push(mid, pts[i + 1]);
      }
      pts = next;
      disp *= 0.52;
    }
    return pts;
  }

  const mainPts = subdividePath(topPos, botPos, 5, 11.0);
  for (let i = 0; i < mainPts.length - 1; i++) {
    const t0 = i / (mainPts.length - 1);
    const t1 = (i + 1) / (mainPts.length - 1);
    const r0 = lerp(trunkRadius, trunkRadius * 0.56, t0);
    const r1 = lerp(trunkRadius, trunkRadius * 0.56, t1);
    addAxialSegment(mainPts[i], mainPts[i + 1], r0, r1);

    // 三维空间分叉支脉（向 X/Y/Z 三个维度自然伸展并渐细收尖）
    if (i >= 3 && i <= mainPts.length - 6 && i % 4 === 0 && rnd() < 0.82) {
      const bStart = mainPts[i].clone();
      const bSign = (i % 8 === 0) ? 1 : -1;
      const bEnd = bStart.clone().add(new THREE.Vector3(
        bSign * (6.5 + rnd() * 9.5),
        -(8.0 + rnd() * 11.0),
        (rnd() - 0.5) * 12.0
      ));
      if (bEnd.y < 1.0) bEnd.y = 1.0;
      const bPts = subdividePath(bStart, bEnd, 3, 3.8);
      for (let k = 0; k < bPts.length - 1; k++) {
        const bt0 = k / (bPts.length - 1);
        const bt1 = (k + 1) / (bPts.length - 1);
        addAxialSegment(bPts[k], bPts[k + 1], lerp(r0 * 0.72, trunkRadius * 0.34, bt0), lerp(r0 * 0.72, trunkRadius * 0.28, bt1));
      }
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 3. 单根 3D 雨滴针尖贴图与真 3D 世界空间雨滴/雪花粒子体积晶格

// 在世界空间 3D 盒体 (-60..60m, 0..20m, -60..60m) 内生成独立的世界坐标 3D 雨针
function build3DRainVolumeMesh(count = 2400, windVec = new THREE.Vector2(0.5, 0.2), seed = 20261018) {
  const rnd = mulberry32(seed);
  const pos = [], uvs = [], idx = [];
  const axis = new THREE.Vector3(windVec.x * 0.16, -1.0, windVec.y * 0.16).normalize();
  const side1 = new THREE.Vector3(0.866, 0, 0.5);
  const side2 = new THREE.Vector3(-0.5, 0, 0.866);

  for (let i = 0; i < count; i++) {
    const x = (rnd() - 0.5) * 96.0;
    const z = (rnd() - 0.5) * 96.0;
    const y = 0.2 + rnd() * 20.0;
    const len = 0.95 + rnd() * 0.65;
    const hw = 0.042 + rnd() * 0.018;
    const pBot = new THREE.Vector3(x, y, z);
    const pTop = pBot.clone().addScaledVector(axis, -len);

    for (const s of [side1, side2]) {
      const b = pos.length / 3;
      pos.push(
        pBot.x - s.x * hw, pBot.y - s.y * hw, pBot.z - s.z * hw,
        pBot.x + s.x * hw, pBot.y + s.y * hw, pBot.z + s.z * hw,
        pTop.x + s.x * hw, pTop.y + s.y * hw, pTop.z + s.z * hw,
        pTop.x - s.x * hw, pTop.y - s.y * hw, pTop.z - s.z * hw
      );
      uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
      idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 在世界空间 3D 盒体 (-60..60m, 0..18m, -60..60m) 内生成数百枚独立的 3D 十字雪花晶粒
function build3DSnowVolumeMesh(count = 1800, seed = 20261019) {

    const r = 0.048 + rnd() * 0.052;

// 新版云层贴图：高分辨率球面经纬网格采样 (1024x384) + 3D 笛卡尔透视云场 + 5 级花椰菜云缘 + 自身 Alpha 仰角平滑消光
function makeCloudTexDisk(n = 256, seed = 101, cloudiness = 0.22, scale = 1.45, sunDir = new THREE.Vector3(0, 0.6, -0.8), mode = 'v5') {
  const w = mode === 'v5' ? 1024 : 384;
  const h = mode === 'v5' ? 384 : 160;
  const data = new Uint8Array(w * h * 4);
  const ov = clamp01((cloudiness - 0.35) / 0.65);
  const thresh = lerp(0.58, 0.20, clamp01(cloudiness));
  const span = lerp(0.20, 0.30, clamp01(cloudiness));

  // 晴天保留丰富高频花椰菜云冠，阴雨天过渡为厚重连绵层积云
  const effScale = mode === 'v5' ? scale * lerp(1.55, 1.15, ov) : scale;
  const rawField = (wx, wz) => {
    const u = wx * 0.28 + 10.0, v = wz * 0.28 + 10.0;
    const macro = periodicFbm(u, v, 3, 4, seed);
    const puffs = periodicPuffs(u * 1.35, v * 1.35, 4, seed + 131);
    const billow = periodicFbm(u * 2.2 + 0.17, v * 2.2 + 0.31, 6, 3, seed + 211);
    const detail = periodicFbm(u * 4.5 + 0.41, v * 4.5 + 0.19, 12, 3, seed + 353);
    return macro * 0.46 + puffs * 0.26 + billow * 0.16 + detail * 0.12;
  };

  const sunN = sunDir.clone().normalize();
  const sx = sunN.x, sz = sunN.z;
  const sLen = Math.hypot(sx, sz);
  const lx = sLen > 0.01 ? (sx / sLen) * 0.06 : 0.045;
  const lz = sLen > 0.01 ? (sz / sLen) * 0.06 : -0.045;

  for (let y = 0; y < h; y++) {
    const v = y / (h - 1); // 0 地平线 .. 1 天顶
    const phi = (1.0 - v) * (Math.PI * 0.5);
    const sp = Math.sin(phi), dy = Math.cos(phi);
    const horizonFade = smoothstep(0.06, 0.38, dy);
    if (horizonFade <= 0.001) continue;

    const proj = effScale / Math.max(0.24, dy + 0.30);
    for (let x = 0; x < w; x++) {
      const theta = (x / w) * Math.PI * 2.0;
      const dx = sp * Math.cos(theta), dz = sp * Math.sin(theta);
      const wx = dx * proj, wz = dz * proj;

      // 晴天在太阳圆盘正前方自然拨开厚云，让日轮与日冕清晰透出
      const sunDot = dx * sunN.x + dy * sunN.y + dz * sunN.z;
      const sunPart = cloudiness < 0.35 ? smoothstep(0.992, 0.92, sunDot) : 1.0;

      const h0 = rawField(wx, wz);
      const d = clamp01((h0 - thresh) / span) * sunPart;
      const density = d * d * (3 - 2 * d) * horizonFade;
      if (density <= 0.002) continue;

      const hSun = rawField(wx + lx, wz + lz);
      const slope = clamp01((h0 - hSun) * 5.8 + 0.56);
      const shade = clamp01((1.0 - slope) * 0.74 + clamp01(d - 0.30) * 0.36 * (1.0 - slope * 0.65));

      const rCol = lerp(1.00, 0.46, shade * 0.80);
      const gCol = lerp(1.00, 0.55, shade * 0.74);
      const bCol = lerp(1.00, 0.72, shade * 0.55);

      const idx = (y * w + x) * 4;
      data[idx] = Math.round(clamp01(rCol) * 255);
      data[idx + 1] = Math.round(clamp01(gCol) * 255);
      data[idx + 2] = Math.round(clamp01(bCol) * 255);
      data[idx + 3] = Math.round(clamp01(Math.pow(density, 0.65) * 0.96) * 255);
    }
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

// 球面经纬 UV 云冠网格（v = 1 - phi/(pi/2)，同纬圈顶点 v 完全恒定，彻底消除多边形弦切齿纹）
function buildCloudHemisphere(lon = 56, lat = 24, radius = 108) {
  const maxPhi = Math.PI * 0.5;
  const pos = [], uvs = [], idx = [];
  for (let y = 0; y <= lat; y++) {
    const t = y / lat;
    const phi = t * maxPhi;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    for (let x = 0; x <= lon; x++) {
      const u = x / lon;
      const theta = u * Math.PI * 2;
      const dx = sp * Math.cos(theta), dz = sp * Math.sin(theta);
      pos.push(dx * radius, cp * radius, dz * radius);
      uvs.push(u, 1.0 - t);
    }
  }
  const stride = lon + 1;
  for (let y = 0; y < lat; y++) {
    for (let x = 0; x < lon; x++) {
      const a = y * stride + x, b = a + stride;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// v3/v4 高斯抗锯齿雨丝贴图：3px 横向平滑高斯截面，彻底消除 1px 斜线缩采样导致的虚线摩尔纹
function makeRainTexNew(w = 256, h = 256, mode = 'v4') {
  const data = new Uint8Array(w * h * 4);
  const rnd = mulberry32(20261011);
  const isSmooth = mode === 'v3' || mode === 'v4' || mode === 'v5' || mode === 'v6';
  const count = isSmooth ? 22 : (mode === 'v2' ? 28 : 110);
  const weights = isSmooth ? [0.48, 1.0, 0.48] : [0.0, 1.0, 0.0];
  for (let s = 0; s < count; s++) {
    const x = Math.floor(rnd() * w);
    const y0 = Math.floor(rnd() * h);
    const len = (isSmooth ? 48 : 34) + Math.floor(rnd() * 52);
    const peakA = 185 + Math.floor(rnd() * 65);
    for (let k = 0; k < len; k++) {
      const t = k / (len - 1);
      const prof = Math.pow(1.0 - t, 0.50) * smoothstep(0.0, 0.14, t);
      const y = (y0 + k) % h;
      for (let ox = -1; ox <= 1; ox++) {
        const wgt = weights[ox + 1];
        if (wgt <= 0) continue;
        const a = Math.round(peakA * prof * wgt);
        const xx = (x + ox + w) % w;
        const idx = (y * w + xx) * 4;
        if (a > data[idx + 3]) {
          data[idx] = 228; data[idx + 1] = 240; data[idx + 2] = 255; data[idx + 3] = a;
        }
      }
    }
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

function makeSandTex(n = 256, mode = 'v2') {
  const data = new Uint8Array(n * n * 4);
  if (mode === 'v2') {
    for (let y = 0; y < n; y++) {
      const v = y / (n - 1);
      const vertFade = smoothstep(0.0, 0.16, v) * Math.pow(clamp01(1.0 - v), 1.35);
      for (let x = 0; x < n; x++) {
        const u = x / n;
        const billow = periodicFbm(u, v * 0.6, 3, 4, 881);
        const stream = periodicFbm(u * 2.0, v * 4.0, 4, 3, 991);
        const d = clamp01((billow * 0.65 + stream * 0.35 - 0.32) * 1.8) * vertFade;
        const shade = lerp(0.76, 1.0, billow);
        const idx = (y * n + x) * 4;
        data[idx] = Math.round(238 * shade);
        data[idx + 1] = Math.round(192 * shade);
        data[idx + 2] = Math.round(125 * shade);
        data[idx + 3] = Math.round(d * 185);
      }
    }
    const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
    t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
    return t;
  }
  const rnd = mulberry32(77);
  for (let y = 0; y < n; y++) {
    const v = y / n;
    for (let x = 0; x < n; x++) {
      const u = x / n;
      const cloud = periodicFbm(u * 0.5, v * 1.5, 4, 4, 881);
      const streak = periodicFbm(u * 0.25, v * 4.0, 4, 3, 991);
      const a = clamp01((cloud * 0.65 + streak * 0.35 - 0.36) * 2.1);
      const idx = (y * n + x) * 4;
      data[idx] = 235; data[idx + 1] = 195; data[idx + 2] = 132;
      data[idx + 3] = Math.round(a * 195);
    }
  }
  for (let s = 0; s < 180; s++) {
    const cx = Math.floor(rnd() * n), cy = Math.floor(rnd() * n);
    const len = 8 + Math.floor(rnd() * 18);
    for (let k = 0; k < len; k++) {
      const xx = (cx + k) % n;
      const idx = (cy * n + xx) * 4;
      data[idx] = 245; data[idx + 1] = 210; data[idx + 2] = 150;
      data[idx + 3] = Math.min(255, data[idx + 3] + 120);
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
