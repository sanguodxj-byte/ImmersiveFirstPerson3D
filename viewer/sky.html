// 网格构造（与 SkyScenery.cs 完全同算法）
// ============================================================
function buildDomeMesh(radius = 128) {
  const lon = 40, lat = 32;
  const pos = [], uvs = [], idx = [];
  for (let y = 0; y <= lat; y++) {
    const v = y / lat;
    const phi = v * Math.PI;
    for (let x = 0; x <= lon; x++) {
      const u = x / lon;
      const theta = u * Math.PI * 2;
      pos.push(Math.sin(phi) * Math.cos(theta) * radius,
               Math.cos(phi) * radius,
               Math.sin(phi) * Math.sin(theta) * radius);
      uvs.push(u, 1 - v);
    }
  }
  for (let y = 0; y < lat; y++) {
    for (let x = 0; x < lon; x++) {
      const a = y * (lon + 1) + x, b = a + lon + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

function buildCloudCapOld(lon = 40, lat = 12, radius = 108) {
  const maxPhi = 1.22;
  const pos = [], uvs = [], idx = [];
  for (let y = 0; y <= lat; y++) {
    const t = y / lat;
    const phi = t * maxPhi;
    for (let x = 0; x <= lon; x++) {
      const u = x / lon;
      const theta = u * Math.PI * 2;
      pos.push(Math.sin(phi) * Math.cos(theta) * radius,
               Math.cos(phi) * radius,
               Math.sin(phi) * Math.sin(theta) * radius);
      uvs.push(u * 3, 1 - t);
    }
  }
  const stride = lon + 1;
  for (let y = 0; y < lat; y++) {
    for (let x = 0; x < lon; x++) {
      const a = y * stride + x, b = a + stride;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 新版平面透视投影云冠：延伸至地平线 pi/2，支持全天空平直随风飘移，远端自动透视加密
function buildCloudCapNew(lon = 48, lat = 20, radius = 108, uvScale = 1.15) {
  const maxPhi = Math.PI * 0.5;
  const pos = [], uvs = [], idx = [];
  for (let y = 0; y <= lat; y++) {
    const t = y / lat;
    const phi = t * maxPhi;
    const sp = Math.sin(phi), cp = Math.cos(phi);
    const proj = uvScale / Math.max(0.24, cp + 0.30);
    for (let x = 0; x <= lon; x++) {
      const u = x / lon;
      const theta = u * Math.PI * 2;
      const dx = sp * Math.cos(theta), dz = sp * Math.sin(theta);
      pos.push(dx * radius, cp * radius, dz * radius);
      uvs.push(dx * proj, dz * proj);
    }
  }
  const stride = lon + 1;
  for (let y = 0; y < lat; y++) {
    for (let x = 0; x < lon; x++) {
      const a = y * stride + x, b = a + stride;
      idx.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

function buildStarDomeOld(count = 420, radius = 118, size = 0.55) {
  const rnd = mulberry32(20261010);
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i < count; i++) {
    const y = rnd() * 0.95 + 0.05;
    const a = rnd() * Math.PI * 2;
    const rxz = Math.sqrt(1 - y * y);
    const n = new THREE.Vector3(Math.cos(a) * rxz, y, Math.sin(a) * rxz);
    const p = n.clone().multiplyScalar(radius);
    let right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), n).normalize();
    if (right.lengthSq() < 0.01) right.set(1, 0, 0);
    const up = new THREE.Vector3().crossVectors(n, right).normalize();
    const s = size * (0.5 + rnd());
    const b = pos.length / 3;
    const p0 = p.clone().addScaledVector(right, -s).addScaledVector(up, -s);
    const p1 = p.clone().addScaledVector(right, s).addScaledVector(up, -s);
    const p2 = p.clone().addScaledVector(right, s).addScaledVector(up, s);
    const p3 = p.clone().addScaledVector(right, -s).addScaledVector(up, s);
    pos.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 新版星穹网格：采样 4x4 星图图集（含色温与星等分布，银河平面附近星群自然加密）
function buildStarDomeNew(count = 720, radius = 118, seed = 20261015) {
  const rnd = mulberry32(seed);
  const pos = [], uvs = [], idx = [];
  const galNorm = new THREE.Vector3(0.44, 0.56, -0.70).normalize();
  for (let i = 0; i < count; i++) {
    let n;
    // 35% 星点聚集在银河带附近，65% 全天球分布
    if (i < count * 0.35) {
      while (true) {
        const y = rnd() * 0.94 + 0.04;
        const a = rnd() * Math.PI * 2;
        const rxz = Math.sqrt(1 - y * y);
        const cand = new THREE.Vector3(Math.cos(a) * rxz, y, Math.sin(a) * rxz);
        if (Math.abs(cand.dot(galNorm)) < 0.24) { n = cand; break; }
      }
    } else {
      const y = rnd() * 0.94 + 0.04;
      const a = rnd() * Math.PI * 2;
      const rxz = Math.sqrt(1 - y * y);
      n = new THREE.Vector3(Math.cos(a) * rxz, y, Math.sin(a) * rxz);
    }
    const p = n.clone().multiplyScalar(radius);
    let right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), n).normalize();
    if (right.lengthSq() < 0.01) right.set(1, 0, 0);
    const up = new THREE.Vector3().crossVectors(n, right).normalize();

    // 幂律星等分布：极少数一等亮星 (row 0)，多数细小微星 (row 2..3)
    const rMag = rnd();
    const row = rMag < 0.07 ? 0 : (rMag < 0.26 ? 1 : (rMag < 0.62 ? 2 : 3));
    const col = Math.floor(rnd() * 4);
    const s = row === 0 ? (0.58 + rnd() * 0.28)
            : row === 1 ? (0.34 + rnd() * 0.16)
            : row === 2 ? (0.22 + rnd() * 0.10)
            : (0.16 + rnd() * 0.08);

    const pad = 0.01;
    const u0 = col * 0.25 + pad, u1 = (col + 1) * 0.25 - pad;
    const v0 = row * 0.25 + pad, v1 = (row + 1) * 0.25 - pad;

    const b = pos.length / 3;
    const p0 = p.clone().addScaledVector(right, -s).addScaledVector(up, -s);
    const p1 = p.clone().addScaledVector(right, s).addScaledVector(up, -s);
    const p2 = p.clone().addScaledVector(right, s).addScaledVector(up, s);
    const p3 = p.clone().addScaledVector(right, -s).addScaledVector(up, s);
    pos.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z);
    uvs.push(u0, v0, u1, v0, u1, v1, u0, v1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

function buildPrecipOld(count = 28) {
  const pos = [], uvs = [], idx = [];
  const halfH = 5.0;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const r = 4.2 + (i % 5) * 0.7;
    const px = Math.cos(a) * r, pz = Math.sin(a) * r;
    const rx = -Math.sin(a), rz = Math.cos(a);
    const width = 1.4;
    const b = pos.length / 3;
    pos.push(
      px - rx * width, -halfH, pz - rz * width,
      px + rx * width, -halfH, pz + rz * width,
      px + rx * width,  halfH, pz + rz * width,
      px - rx * width,  halfH, pz - rz * width
    );
    const u0 = (i % 4) * 0.25;
    uvs.push(u0, 0, u0 + 0.25, 0, u0 + 0.25, 1, u0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 新版三层景深雨雪笼（支持 uShear 斜向风偏 UV 映射，保持柱面竖直不产生倾斜摩尔纹）
function buildPrecipRing(count, rMin, rStep, halfH, width, uTile, vTile, seedOffset = 0, uShear = 0.0) {
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i < count; i++) {
    const a = ((i + (seedOffset * 0.37)) / count) * Math.PI * 2;
    const r = rMin + ((i * 3 + seedOffset) % 5) * rStep;
    const px = Math.cos(a) * r, pz = Math.sin(a) * r;
    const rx = -Math.sin(a), rz = Math.cos(a);
    const b = pos.length / 3;
    pos.push(
      px - rx * width, -halfH, pz - rz * width,
      px + rx * width, -halfH, pz + rz * width,
      px + rx * width,  halfH, pz + rz * width,
      px - rx * width,  halfH, pz - rz * width
    );
    const u0 = (i * 0.19) % 1.0;
    const v0 = (i * 0.31) % 1.0;
    uvs.push(u0, v0, u0 + uTile, v0, u0 + uTile + uShear, v0 + vTile, u0 + uShear, v0 + vTile);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 地面实心水花溅射斑（雨天地面跳动的水滴冠与实心水花盘，严禁空心环）
function buildRainSplashes(count = 95, seed = 901) {
  const rnd = mulberry32(seed);
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i < count; i++) {
    const r = 1.6 + rnd() * 9.5;
    const a = rnd() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const s = 0.08 + rnd() * 0.10;
    const y = 0.025;
    const b = pos.length / 3;
    // 地面实心水斑 + 竖起的小水珠实心片
    pos.push(x - s, y, z - s, x + s, y, z - s, x + s, y, z + s, x - s, y, z + s);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);

    const h = s * 1.35;
    const b2 = pos.length / 3;
    pos.push(x - s * 0.55, y, z, x + s * 0.55, y, z, x + s * 0.55, y + h, z, x - s * 0.55, y + h, z);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b2, b2 + 1, b2 + 2, b2, b2 + 2, b2 + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// 3D 分叉闪电网格（支持 widthScale 生成外层电光蓝辉光带 + 内层炽白电弧核）
function buildLightningBoltMesh(origin, seed = 404, widthScale = 1.0) {
  const rnd = mulberry32(seed);
  const pos = [], uvs = [], idx = [];
  const side = new THREE.Vector3(-origin.z, 0, origin.x).normalize();
  function addSegment(p0, p1, w0, w1) {
    const b = pos.length / 3;
    pos.push(
      p0.x - side.x * w0, p0.y, p0.z - side.z * w0,
      p0.x + side.x * w0, p0.y, p0.z + side.z * w0,
      p1.x + side.x * w1, p1.y, p1.z + side.z * w1,
      p1.x - side.x * w1, p1.y, p1.z - side.z * w1
    );
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  let cur = origin.clone();
  const steps = 16;
  for (let i = 0; i < steps; i++) {
    const t = (i + 1) / steps;
    const jitter = (rnd() - 0.48) * 4.2;
    const next = origin.clone();
    next.y = lerp(origin.y, 0.2, t);
    next.addScaledVector(side, jitter);
    const w = lerp(0.56, 0.22, t) * widthScale;
    addSegment(cur, next, w, w * 0.92);

    if (i >= 2 && i <= 12 && rnd() < 0.60) {
      let bCur = next.clone();
      const bDir = (i % 2 === 0 ? 1 : -1);
      const bSteps = 4 + Math.floor(rnd() * 4);
      for (let k = 0; k < bSteps; k++) {
        const bNext = bCur.clone();
        bNext.y -= 3.0 + rnd() * 2.4;
        bNext.addScaledVector(side, bDir * (2.0 + rnd() * 2.5));
        const bw = lerp(w * 0.58, 0.09 * widthScale, (k + 1) / bSteps);
        addSegment(bCur, bNext, bw, bw * 0.75);
        bCur = bNext;
      }
    }
    cur = next;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

// ============================================================
// 殖民地前景参照物（地平线、墙体、树木、水面，用于直观检验天空与地面/雾的融合）
// ============================================================
function makeTerrainTex(env) {
  const n = 128;
  const data = new Uint8Array(n * n * 4);
  const isSnow = env.snow > 0.5;
  const isSand = env.sand > 0.5;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const f = periodicFbm(x / n, y / n, 8, 4, 333);
      let base = isSnow ? [0.78, 0.83, 0.90] : isSand ? [0.58, 0.46, 0.28] : [0.26, 0.34, 0.20];
      const mod = 0.85 + 0.30 * f;
      const g = lerp(0.28, 1.0, env.glow);
      const idx = (y * n + x) * 4;
      data[idx] = Math.round(clamp01(base[0] * mod * g) * 255);
      data[idx + 1] = Math.round(clamp01(base[1] * mod * g) * 255);
      data[idx + 2] = Math.round(clamp01(base[2] * mod * g) * 255);
      data[idx + 3] = 255;
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(32, 32);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

function buildColonyForeground(env) {
  const group = new THREE.Group();
  const lit = lerp(0.26, 1.0, env.glow) + env.flash * 0.35;

  // 地面 (140m 半径圆盘)
  const groundGeo = new THREE.CircleGeometry(138, 64);
  groundGeo.rotateX(-Math.PI / 2);
  const groundMat = new THREE.MeshBasicMaterial({ map: makeTerrainTex(env), fog: true });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.renderOrder = 100;
  group.add(ground);

  // 实心殖民地建筑群与树木剪影（分布在四周 16m..55m，提供地平线空间深度参照）
  const wallCol = new THREE.Color(0.52 * lit, 0.48 * lit, 0.42 * lit);
  const roofCol = new THREE.Color(0.36 * lit, 0.33 * lit, 0.30 * lit);
  const trunkCol = new THREE.Color(0.32 * lit, 0.22 * lit, 0.14 * lit);
  const leafBase = env.snow > 0.5 ? [0.68, 0.76, 0.82] : env.sand > 0.5 ? [0.46, 0.44, 0.24] : [0.20, 0.38, 0.18];
  const leafCol = new THREE.Color(leafBase[0] * lit, leafBase[1] * lit, leafBase[2] * lit);

  const wallMat = new THREE.MeshBasicMaterial({ color: wallCol, fog: true });
  const roofMat = new THREE.MeshBasicMaterial({ color: roofCol, fog: true });
  const trunkMat = new THREE.MeshBasicMaterial({ color: trunkCol, fog: true });
  const leafMat = new THREE.MeshBasicMaterial({ color: leafCol, fog: true });

  const rnd = mulberry32(888);
  // 8 座远近高低错落的殖民地平房（高 2.70m = Metrics3D.CeilingHeight）
  for (let i = 0; i < 10; i++) {
    const ang = (i / 10) * Math.PI * 2 + 0.18;
    const dist = 20 + (i % 3) * 14;
    const bx = Math.cos(ang) * dist, bz = Math.sin(ang) * dist;
    const bw = 4 + (i % 3) * 2, bd = 4 + ((i + 1) % 2) * 2, bh = 2.70;
    const bMesh = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), wallMat);
    bMesh.position.set(bx, bh / 2, bz);
    bMesh.renderOrder = 110;
    group.add(bMesh);
    const rMesh = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.3, 0.25, bd + 0.3), roofMat);
    rMesh.position.set(bx, bh + 0.125, bz);
    rMesh.renderOrder = 111;
    group.add(rMesh);
  }

  // 36 棵实心树冠与树干
  for (let i = 0; i < 36; i++) {
    const ang = rnd() * Math.PI * 2;
    const dist = 12 + rnd() * 52;
    const tx = Math.cos(ang) * dist, tz = Math.sin(ang) * dist;
    const th = 2.6 + rnd() * 2.2;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.20, th * 0.45, 8), trunkMat);
    trunk.position.set(tx, th * 0.225, tz);
    trunk.renderOrder = 112;
    group.add(trunk);

    const crown = new THREE.Mesh(new THREE.ConeGeometry(th * 0.38, th * 0.72, 10), leafMat);
    crown.position.set(tx, th * 0.62, tz);
    crown.renderOrder = 113;
    group.add(crown);
  }
  return group;
}

// ============================================================
// 组装完整天空盒 + 天气场景
// ============================================================
function buildScene(presetKey, mode) {
  while (scene.children.length > 0) scene.remove(scene.children[0]);
  const env = sampleEnv(presetKey, mode);

  // 相机朝向：若 URL 未显式传 yaw，则朝向该预设最佳观赏方向（迎向日出/日落/月亮/闪电）
  const yawDeg = qs.has('yaw') ? YAW : (env.defaultYaw || 0);
  const pitchDeg = PITCH;
  const yawRad = yawDeg * Math.PI / 180;
  const pitchRad = pitchDeg * Math.PI / 180;
  const lookDir = new THREE.Vector3(
    Math.cos(pitchRad) * Math.sin(yawRad),
    Math.sin(pitchRad),
    -Math.cos(pitchRad) * Math.cos(yawRad)
  );
  camera.lookAt(camera.position.clone().add(lookDir));

  // 雾效
  const thick = clamp01(env.fog * 0.95 + env.rain * 0.28 + env.snow * 0.22 + env.sand * 0.6 + env.storm * 0.12);
  let fogCol = cLerp(env.horizon, [0.78, 0.80, 0.82], 0.45);
  if (env.sand > 0.15) fogCol = cLerp(fogCol, [0.72, 0.56, 0.34], env.sand);
  if (env.snow > 0.15) fogCol = cLerp(fogCol, [0.86, 0.89, 0.93], 0.55);

  if (mode === 'old') {
    if (thick >= 0.08) {
      const end = lerp(120, 16, thick);
      const start = lerp(48, 3.5, thick);
      scene.fog = new THREE.Fog(new THREE.Color(fogCol[0], fogCol[1], fogCol[2]), start, Math.max(start + 6, end));
    } else {
      scene.fog = null;
    }
  } else {
    // 新版：晴天也带远距大气透视雾（80m..138m），消除地图边缘硬切；恶劣天气收紧地面雾，但天空盒半径在 fogStart 内故绝不被雾吞没
    const hCol = cLerp(env.horizon, fogCol, clamp01(thick * 1.2));
    const start = thick >= 0.06 ? lerp(52, 5.5, thick) : 78;
    const end = thick >= 0.06 ? lerp(122, 24, thick) : 138;
    scene.fog = new THREE.Fog(new THREE.Color(hCol[0], hCol[1], hCol[2]), start, Math.max(start + 8, end));
  }

  scene.background = new THREE.Color(env.horizon[0], env.horizon[1], env.horizon[2]);

  // 1. 世界天穹（mode='old' 复现旧版绑相机，新版固定在世界原点 WORLD_ORIGIN，半径 680m）
  const domeMat = new THREE.MeshBasicMaterial({
    map: makeDomeTexture(env, mode),
    side: THREE.DoubleSide,
    depthWrite: mode === 'old',
    fog: mode === 'old'
  });
  const dome = new THREE.Mesh(buildDomeMesh(mode === 'old' ? 130 : 680), domeMat);
  dome.position.copy(mode === 'old' ? camera.position : WORLD_ORIGIN);
  dome.renderOrder = 1;
  scene.add(dome);

  // 2. 星空（固定在世界原点 WORLD_ORIGIN，半径 640m）
  if (env.glow < 0.55) {
    const starAlpha = clamp01((0.55 - env.glow) / 0.45) * (1 - env.cloudiness * 0.65) * (1 - env.fog);
    if (starAlpha > 0.02) {
      const starGeo = mode === 'old' ? buildStarDomeOld(420, 118, 0.55) : buildStarDomeNew(880, 640, 20261015);
      const starTex = mode === 'old' ? makeRadialTex(16, 0.1, 1.0) : makeStarAtlasTex(128);
      const starMat = new THREE.MeshBasicMaterial({
        map: starTex,
        transparent: true,
        opacity: starAlpha * (mode === 'old' ? 0.9 : 0.96),
        side: THREE.DoubleSide,
        depthWrite: false,
        fog: mode === 'old'
      });
      const stars = new THREE.Mesh(starGeo, starMat);
      stars.position.copy(mode === 'old' ? camera.position : WORLD_ORIGIN);
      stars.renderOrder = 5;
      scene.add(stars);
    }
  }

  // 3. 太阳与月亮（固定在世界天球坐标 WORLD_ORIGIN + dir * 600m）
  const isRefined = mode === 'v2' || mode === 'v3' || mode === 'v4' || mode === 'v5' || mode === 'v6';
  const isSmooth = mode === 'v3' || mode === 'v4' || mode === 'v5' || mode === 'v6';
  const skyDist = mode === 'old' ? 112 : 600;
  const distScale = skyDist / 112.0;
  const skyAnchor = mode === 'old' ? camera.position : WORLD_ORIGIN;

  const above = clamp01((env.sunDir.y + 0.05) / 0.18);
  const sunVis = above * (1 - env.cloudiness * 0.80) * (1 - env.fog * 0.72) * clamp01(env.glow * 1.35);
  if (sunVis > 0.02) {
    const low = 1 - clamp01(env.sunDir.y * 2.2);
    const sunCol = isRefined
      ? cLerp([1.0, 0.99, 0.94], [1.0, 0.76, 0.36], low)
      : cLerp([1.0, 0.98, 0.90], [1.0, 0.55, 0.22], low);
    const haloCol = cLerp([1.0, 0.96, 0.86], [1.0, 0.52, 0.18], low);
    const sunPos = skyAnchor.clone().addScaledVector(env.sunDir, skyDist);

    const haloSize = (mode === 'old' ? (28 + 18 * low) : (38 + 24 * low)) * distScale;
    const haloTex = mode === 'old' ? makeRadialTex(64, 0.0, 0.55) : makeCoronaTex(128);
    const haloMat = new THREE.MeshBasicMaterial({
      map: haloTex,
      color: new THREE.Color(haloCol[0], haloCol[1], haloCol[2]),
      transparent: true,
      opacity: (mode === 'old' ? 0.28 : 0.65) * sunVis * Math.max(0.5, env.shine),
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: mode === 'old'
    });
    const haloQuad = new THREE.Mesh(new THREE.PlaneGeometry(haloSize, haloSize), haloMat);
    haloQuad.position.copy(sunPos);
    haloQuad.lookAt(skyAnchor);
    haloQuad.renderOrder = mode === 'v5' ? 22.7 : 9;
    scene.add(haloQuad);

    const discSize = (mode === 'old' ? (6.5 + 4 * low) : (10.5 + 5.5 * low)) * distScale;
    const discTex = isRefined ? makeSunDiscTex(64, low) : makeRadialTex(64, 0.22, 1.15);
    const sunMat = new THREE.MeshBasicMaterial({
      map: discTex,
      color: isRefined ? new THREE.Color(1, 1, 1) : new THREE.Color(sunCol[0], sunCol[1], sunCol[2]),
      transparent: true,
      opacity: 0.98 * sunVis,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: mode === 'old'
    });
    const sunQuad = new THREE.Mesh(new THREE.PlaneGeometry(discSize, discSize), sunMat);
    sunQuad.position.copy(sunPos);
    sunQuad.lookAt(skyAnchor);
    sunQuad.renderOrder = mode === 'v5' ? 22.8 : 10;
    scene.add(sunQuad);
  }

  if (env.glow <= 0.42 && env.fog <= 0.55) {
    const ma = clamp01((0.42 - env.glow) / 0.42) * (1 - env.cloudiness * 0.7);
    if (ma >= 0.02) {
      const mPos = skyAnchor.clone().addScaledVector(env.moonDir, skyDist);
      if (mode !== 'old') {
        const mHaloMat = new THREE.MeshBasicMaterial({
          map: makeRadialTex(64, 0.0, 1.5),
          color: new THREE.Color(0.65, 0.78, 1.0),
          transparent: true,
          opacity: 0.44 * ma,
          side: THREE.DoubleSide,
          depthWrite: false,
          fog: false
        });
        const mHalo = new THREE.Mesh(new THREE.PlaneGeometry(30 * distScale, 30 * distScale), mHaloMat);
        mHalo.position.copy(mPos);
        mHalo.lookAt(skyAnchor);
        mHalo.renderOrder = mode === 'v5' ? 22.6 : 7;
        scene.add(mHalo);
      }
      const moonSize = (mode === 'old' ? 3.2 : (isRefined ? 11.5 : 8.2)) * distScale;
      const moonTex = mode === 'old' ? makeRadialTex(32, 0.35, 1.1) : makeMoonTex(128);
      const moonMat = new THREE.MeshBasicMaterial({
        map: moonTex,
        color: new THREE.Color(0.94, 0.97, 1.0),
        transparent: true,
        opacity: (mode === 'old' ? 0.85 : 0.98) * ma,
        side: THREE.DoubleSide,
        depthWrite: false,
        fog: mode === 'old'
      });
      const moonQuad = new THREE.Mesh(new THREE.PlaneGeometry(moonSize, moonSize), moonMat);
      moonQuad.position.copy(mPos);
      moonQuad.lookAt(skyAnchor);
      moonQuad.renderOrder = mode === 'v5' ? 22.7 : 8;
      scene.add(moonQuad);
    }
  }

  // 4. 云层系统：v6 采用真 3D 世界空间体积云团簇 + 高空极薄卷云底衬
  let lit = cLerp([0.38, 0.44, 0.58], [1.0, 1.0, 1.0], env.glow);
  lit = cLerp(lit, env.horizon, isRefined ? 0.08 : 0.28);
  if (env.twilight > 0.05 && mode !== 'old') {
    lit = cLerp(lit, [1.0, 0.78, 0.56], env.twilight * 0.65);
  }
  if (env.storm > 0.2) {
    lit = isRefined
      ? cLerp(lit, [0.24, 0.29, 0.40], env.storm * 0.78)
      : cLerp(lit, [0.28, 0.31, 0.38], env.storm * 0.68);
  }
  if (env.snow > 0.2) lit = cLerp(lit, [0.88, 0.92, 0.97], 0.48);
  if (env.flash > 0.02 && mode === 'v1') lit = cLerp(lit, [0.92, 0.96, 1.0], env.flash * 0.85);

  const isClearNight = env.glow < 0.2 && env.rain < 0.1 && env.snow < 0.1 && env.storm < 0.1;

  if (mode === 'v6') {
    // 远空高积云/卷云衬底
    const cTexFar = makeCloudTexDisk(256, 307, env.cloudiness * 0.65, 0.62, env.sunDir, 'v5');
    const aFar = env.sand > 0.5 ? 0.05 : (isClearNight ? 0.12 : lerp(0.32, 0.65, env.cloudiness));
    const cloudFarMat = new THREE.MeshBasicMaterial({
      map: cTexFar,
      color: new THREE.Color(Math.min(1, lit[0] + 0.04), Math.min(1, lit[1] + 0.04), Math.min(1, lit[2] + 0.06)),
      transparent: true,
      opacity: aFar,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: false
    });
    const cloudFar = new THREE.Mesh(buildCloudHemisphere(64, 28, 560), cloudFarMat);
    cloudFar.position.copy(WORLD_ORIGIN);
    cloudFar.renderOrder = 15;
    scene.add(cloudFar);

    // 真 3D 体积切片云场（在世界空间 Y = 31m..40.5m 处由顶至底叠加 12 层三维体积截面，100% 锚定在 WORLD_ORIGIN）
    if (env.sand < 0.5) {
      const slices = 12;
      const baseAlt = env.cloudiness > 0.55 ? 31.0 : 33.0;
      const topAlt = env.cloudiness > 0.55 ? 38.5 : 40.5;
      const sunH = new THREE.Vector2(env.sunDir.x, env.sunDir.z);
      if (sunH.lengthSq() > 0.001) sunH.normalize();

      for (let k = slices - 1; k >= 0; k--) {
        const hFrac = k / (slices - 1);
        const sliceY = lerp(baseAlt, topAlt, hFrac);
        const sliceTex = makeVolumetricCloudSliceTex(512, 101, env.cloudiness, hFrac, env.sunDir, env);
        const sliceOp = isClearNight ? 0.22 : 1.0;
        const sliceMat = new THREE.MeshBasicMaterial({
          map: sliceTex,
          transparent: true,
          opacity: sliceOp,
          side: THREE.DoubleSide,
          depthWrite: false,
          fog: false
        });
        const sliceMesh = new THREE.Mesh(build3DCloudSlabSliceMesh(165.0, sliceY, 26.0), sliceMat);
        sliceMesh.position.set(WORLD_ORIGIN.x + sunH.x * hFrac * 1.4, WORLD_ORIGIN.y, WORLD_ORIGIN.z + sunH.y * hFrac * 1.4);
        sliceMesh.renderOrder = 18 + (slices - 1 - k) * 0.35;
        scene.add(sliceMesh);
      }
    }
  } else {
    const aNear = (mode === 'v4' || mode === 'v5')
      ? (env.sand > 0.5 ? 0.12 : (isClearNight ? 0.24 : lerp(0.88, 0.96, env.cloudiness)))
      : (isRefined ? lerp(0.88, 0.96, env.cloudiness) : lerp(mode === 'old' ? 0.28 : 0.38, 0.94, env.cloudiness));
    const aFar = (mode === 'v4' || mode === 'v5')
      ? (env.sand > 0.5 ? 0.08 : (isClearNight ? 0.14 : lerp(0.58, 0.80, env.cloudiness)))
      : (isRefined ? lerp(0.58, 0.80, env.cloudiness) : lerp(mode === 'old' ? 0.18 : 0.26, 0.68, env.cloudiness));

    const cTexNear = mode === 'old'
      ? makeCloudTexOld(256)
      : makeCloudTexDisk(256, 101, env.cloudiness, 0.88, env.sunDir, mode);
    const cTexFar = mode === 'old'
      ? cTexNear
      : makeCloudTexDisk(256, 307, env.cloudiness * 0.78, 0.62, env.sunDir, mode);

    const cloudFarGeo = mode === 'old' ? buildCloudCapOld(40, 12, 124) : buildCloudHemisphere(64, 28, 122);
    const cloudFarMat = new THREE.MeshBasicMaterial({
      map: cTexFar,
      color: new THREE.Color(Math.min(1, lit[0] + 0.04), Math.min(1, lit[1] + 0.04), Math.min(1, lit[2] + 0.06)),
      transparent: true,
      opacity: aFar,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: mode === 'old'
    });
    const cloudFar = new THREE.Mesh(cloudFarGeo, cloudFarMat);
    cloudFar.position.copy(camera.position);
    cloudFar.renderOrder = 20;
    scene.add(cloudFar);

    const cloudNearGeo = mode === 'old' ? buildCloudCapOld(40, 12, 108) : buildCloudHemisphere(64, 28, 108);
    const cloudNearMat = new THREE.MeshBasicMaterial({
      map: cTexNear,
      color: new THREE.Color(lit[0], lit[1], lit[2]),
      transparent: true,
      opacity: aNear,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: mode === 'old'
    });
    const cloudNear = new THREE.Mesh(cloudNearGeo, cloudNearMat);
    cloudNear.position.copy(camera.position);
    cloudNear.renderOrder = 22;
    scene.add(cloudNear);
  }

  // 5. 雷暴 3D 闪电束
  if (mode === 'v6' && (env.flash > 0.05 || env.storm > 0.5)) {
    // v6：100% 固定在世界坐标 (wx, y, wz) 的 3D 等离子体分形闪电（绝不随 camera.position 移动或旋转！）
    const stormYawRad = (PRESETS.storm.defaultYaw || 230) * Math.PI / 180;
    const worldBoltDir = new THREE.Vector3(Math.sin(stormYawRad), 0, -Math.cos(stormYawRad));
    const worldBoltRight = new THREE.Vector3(-worldBoltDir.z, 0, worldBoltDir.x);
    const plasmaTex = makeLightningPlasmaTex(64, 64);
    const plasmaMat = new THREE.MeshBasicMaterial({
      map: plasmaTex,
      transparent: true,
      opacity: 0.98,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: false
    });

    const spawnWorldBolt = (rightOff, dist, cloudY, seed, radius) => {
      const topW = WORLD_ORIGIN.clone().addScaledVector(worldBoltDir, dist).addScaledVector(worldBoltRight, rightOff);
      topW.y = cloudY;
      const botW = topW.clone().addScaledVector(worldBoltRight, (seed % 2 === 0 ? 3.5 : -3.5));
      botW.y = 0.0;

      const inCloudGlowMat = new THREE.MeshBasicMaterial({
        map: makeRadialTex(64, 0.0, 1.8),
        color: new THREE.Color(0.55, 0.80, 1.0),
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        depthWrite: false,
        fog: false
      });
      const inCloudGlow = new THREE.Mesh(new THREE.PlaneGeometry(34, 24), inCloudGlowMat);
      inCloudGlow.position.copy(topW).setY(cloudY - 2.0);
      inCloudGlow.lookAt(WORLD_ORIGIN);
      inCloudGlow.renderOrder = 94;
      scene.add(inCloudGlow);

      const boltMesh = new THREE.Mesh(build3DWorldLightningBolt(topW, botW, seed, radius), plasmaMat);
      boltMesh.renderOrder = 95;
      scene.add(boltMesh);
    };

    spawnWorldBolt(-6.0, 52.0, 34.0, 404, 1.65);
    spawnWorldBolt(14.0, 64.0, 36.0, 709, 1.45);
  } else if (mode !== 'old' && (env.flash > 0.05 || env.storm > 0.5)) {
    const boltDir = lookDir.clone(); boltDir.y = 0; boltDir.normalize();
    const boltRight = new THREE.Vector3(-boltDir.z, 0, boltDir.x);

    const addBolt = (offsetRight, dist, topY, seed) => {
      const origin = camera.position.clone().addScaledVector(boltDir, dist).addScaledVector(boltRight, offsetRight);
      origin.y = topY;

      const glowMat = new THREE.MeshBasicMaterial({
        map: makeRadialTex(64, 0.0, 1.7),
        color: new THREE.Color(0.48, 0.72, 1.0),
        transparent: true,
        opacity: isRefined ? 0.68 : 0.45,
        side: THREE.DoubleSide,
        depthWrite: false,
        fog: false
      });
      const flashGlow = new THREE.Mesh(new THREE.PlaneGeometry(58, 52), glowMat);
      flashGlow.position.copy(origin).setY(topY * 0.52);
      flashGlow.lookAt(camera.position);
      flashGlow.renderOrder = 23;
      scene.add(flashGlow);

      if (isRefined) {
        const outerMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(0.45, 0.75, 1.0),
          transparent: true,
          opacity: 0.58,
          side: THREE.DoubleSide,
          depthWrite: false,
          fog: false
        });
        const outerBolt = new THREE.Mesh(buildLightningBoltMesh(origin, seed, 2.5), outerMat);
        outerBolt.renderOrder = 24;
        scene.add(outerBolt);
      }

      const coreMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(0.96, 0.99, 1.0),
        transparent: true,
        opacity: 0.98,
        side: THREE.DoubleSide,
        depthWrite: false,
        fog: false
      });
      const coreBolt = new THREE.Mesh(buildLightningBoltMesh(origin, seed, 1.05), coreMat);
      coreBolt.renderOrder = 25;
      scene.add(coreBolt);
    };

    addBolt(-8, 56, isSmooth ? 82 : 46, 404);
    if (isRefined) addBolt(15, 66, isSmooth ? 78 : 44, 709);
  }

  // 6. 殖民地地面与建筑参照
  scene.add(buildColonyForeground(env));

  // 7. 降水（雨丝 / 雪花 / 扬沙 / 地面雨花）
  const snowing = env.snow > 0.15 && env.snow >= env.rain * 0.5;
  const sanding = !snowing && env.sand > env.rain && env.sand > 0.2;
  const rate = snowing ? env.snow : (sanding ? env.sand : env.rain);
  if (rate >= 0.08) {
    if (mode === 'old') {
      const pTex = snowing ? makeSnowTexOld(64) : makeRainTexOld(32, 128);
      const a = lerp(0.25, snowing ? 0.7 : 0.55, clamp01(rate));
      const tint = snowing ? [0.95, 0.97, 1.0] : sanding ? [0.85, 0.7, 0.42] : [0.75, 0.82, 0.9];
      const pMat = new THREE.MeshBasicMaterial({
        map: pTex,
        color: new THREE.Color(tint[0], tint[1], tint[2]),
        transparent: true,
        opacity: sanding ? a * 0.8 : a,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const pMesh = new THREE.Mesh(buildPrecipOld(28), pMat);
      pMesh.position.copy(camera.position);
      pMesh.renderOrder = 200;
      scene.add(pMesh);
    } else if (sanding && isRefined) {
      const sandTex = makeSandTex(256, 'v2');
      [
        { r: 12.0, h: 5.5, count: 20, w: 2.2, uT: 1.0, op: 0.52, seed: 1 },
        { r: 22.0, h: 8.0, count: 24, w: 3.4, uT: 1.0, op: 0.65, seed: 2 }
      ].forEach((rg, idx) => {
        const mat = new THREE.MeshBasicMaterial({
          map: sandTex,
          transparent: true,
          opacity: rg.op * clamp01(rate),
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(buildPrecipRing(rg.count, rg.r, 1.2, rg.h, rg.w, rg.uT, 1.0, rg.seed), mat);
        mesh.position.set(WORLD_ORIGIN.x, rg.h * 0.65, WORLD_ORIGIN.z);
        mesh.renderOrder = 198 + idx;
        scene.add(mesh);
      });
    } else if (mode === 'v6') {
      // v6：100% 固定在世界坐标 WORLD_ORIGIN 的 3D 雨滴/雪花粒子体积晶格与地面水花
      const windVec = new THREE.Vector2(Math.cos(env.windAngle), Math.sin(env.windAngle)).multiplyScalar(env.wind);
      if (snowing) {
        const snowVolMat = new THREE.MeshBasicMaterial({
          map: makeRadialTex(32, 0.25, 1.5),
          color: new THREE.Color(0.96, 0.98, 1.0),
          transparent: true,
          opacity: 0.85 * clamp01(rate),
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const snowVol = new THREE.Mesh(build3DSnowVolumeMesh(780, 20261019), snowVolMat);
        snowVol.position.copy(WORLD_ORIGIN);
        snowVol.renderOrder = 200;
        scene.add(snowVol);
      } else {
        const rainVolMat = new THREE.MeshBasicMaterial({
          map: makeRainNeedleTex(32, 128),
          color: new THREE.Color(0.84, 0.92, 1.0),
          transparent: true,
          opacity: 0.72 * clamp01(rate),
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const rainVol = new THREE.Mesh(build3DRainVolumeMesh(950, windVec, 20261018), rainVolMat);
        rainVol.position.copy(WORLD_ORIGIN);
        rainVol.renderOrder = 200;
        scene.add(rainVol);

        const splashMat = new THREE.MeshBasicMaterial({
          map: makeRadialTex(32, 0.25, 1.4),
          color: new THREE.Color(0.82, 0.90, 0.98),
          transparent: true,
          opacity: 0.55 * clamp01(env.rain),
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const splashes = new THREE.Mesh(buildRainSplashes(110, 901), splashMat);
        splashes.position.copy(WORLD_ORIGIN);
        splashes.renderOrder = 195;
        scene.add(splashes);
      }
    } else {
      const pTex = snowing ? makeSnowTexNew(256, isRefined ? 'v2' : mode) : (sanding ? makeSandTex(256, mode) : makeRainTexNew(256, 256, mode));
      const baseA = isRefined
        ? lerp(0.24, snowing ? 0.65 : 0.48, clamp01(rate))
        : lerp(0.32, snowing ? 0.82 : (sanding ? 0.72 : 0.68), clamp01(rate));
      const tint = snowing ? [0.95, 0.98, 1.0] : sanding ? [0.88, 0.71, 0.44] : [0.82, 0.90, 1.0];

      const rings = isSmooth ? [
        { count: 16, rMin: 3.6, rStep: 0.45, h: 4.8, w: 1.35, uT: 1.0, vT: 1.2, op: baseA * 0.90, seed: 1, shear: snowing ? 0.08 : 0.22 },
        { count: 20, rMin: 7.2, rStep: 0.65, h: 6.5, w: 1.75, uT: 1.2, vT: 1.5, op: baseA * 0.60, seed: 2, shear: snowing ? 0.10 : 0.26 }
      ] : (mode === 'v2' ? [
        { count: 18, rMin: 3.4, rStep: 0.45, h: 4.8, w: 1.25, uT: snowing ? 1.3 : 1.5, vT: snowing ? 1.4 : 1.8, op: baseA * 0.92, seed: 1, shear: 0 },
        { count: 22, rMin: 6.8, rStep: 0.65, h: 6.5, w: 1.65, uT: snowing ? 1.6 : 1.8, vT: snowing ? 1.6 : 2.2, op: baseA * 0.62, seed: 2, shear: 0 }
      ] : [
        { count: 22, rMin: 2.3, rStep: 0.35, h: 4.5, w: 1.05, uT: snowing ? 1.8 : 2.2, vT: snowing ? 2.2 : 2.8, op: baseA * 0.95, seed: 1, shear: 0 },
        { count: 28, rMin: 4.8, rStep: 0.55, h: 6.0, w: 1.35, uT: snowing ? 2.2 : 2.8, vT: snowing ? 2.6 : 3.4, op: baseA * 0.75, seed: 2, shear: 0 },
        { count: 32, rMin: 8.5, rStep: 0.85, h: 7.5, w: 1.75, uT: snowing ? 2.8 : 3.4, vT: snowing ? 3.0 : 4.0, op: baseA * 0.52, seed: 3, shear: 0 }
      ]);
      rings.forEach((rg, idx) => {
        const mat = new THREE.MeshBasicMaterial({
          map: pTex,
          color: new THREE.Color(tint[0], tint[1], tint[2]),
          transparent: true,
          opacity: rg.op,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(buildPrecipRing(rg.count, rg.rMin, rg.rStep, rg.h, rg.w, rg.uT, rg.vT, rg.seed, rg.shear || 0), mat);
        mesh.position.copy(camera.position);
        if (!isSmooth) {
          const tilt = clamp01(env.wind / 2.0) * (snowing ? 0.10 : 0.18);
          mesh.rotation.z = -tilt;
        }
        mesh.renderOrder = 200 + idx;
        scene.add(mesh);
      });

      if (!snowing && !sanding && env.rain > 0.15) {
        const splashMat = new THREE.MeshBasicMaterial({
          map: makeRadialTex(32, 0.25, 1.4),
          color: new THREE.Color(0.82, 0.90, 0.98),
          transparent: true,
          opacity: 0.55 * clamp01(env.rain),
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const splashes = new THREE.Mesh(buildRainSplashes(110, 901), splashMat);
        splashes.position.set(camera.position.x, 0, camera.position.z);
        splashes.renderOrder = 195;
        scene.add(splashes);
      }
    }
  }

  document.getElementById('hud').innerHTML =
    '<b>' + env.label + '</b> [' + mode.toUpperCase() + '] ' +
    'sunY=' + env.sunDir.y.toFixed(2) + ' glow=' + env.glow.toFixed(2) +
    ' cloud=' + env.cloudiness.toFixed(2);

  renderer.render(scene, camera);
}

buildScene(PRESET, MODE);

if (!STILL) {
  const bar = document.getElementById('bar');
  Object.keys(PRESETS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    if (k === PRESET) b.classList.add('on');
    b.onclick = () => {
      location.search = '?mode=' + MODE + '&preset=' + k;
    };
    bar.appendChild(b);
  });
}
</script>
</body>
</html>
